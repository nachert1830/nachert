<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Оцифровка листа — бета</title>
<style>
:root{--bg:#f6f5f1;--fg:#1c1c1a;--mut:#6b6a63;--card:#fff;--line:#dcdad2;--acc:#1f5fd1;--ok:#1d7a3a;--warn:#c26a00;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecebe6;--mut:#9d9b92;--card:#1f1f1c;--line:#34332f;--acc:#6ea0ff;--ok:#5cc37b;--warn:#f0a040;--bad:#ff8a80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:.2em 0}.sub{color:var(--mut);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
button,.btn{font:inherit;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 16px;cursor:pointer;display:inline-block}
button.sec{background:transparent;color:var(--acc);border:1px solid var(--acc)}button:disabled{opacity:.5;cursor:default}
input[type=file]{display:none}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:flex;gap:6px;align-items:center;color:var(--mut)}input[type=text],input[type=number],input[type=password],select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:7.5em}
.steps{list-style:none;margin:0;padding:0}.steps li{padding:5px 0;color:var(--mut)}.steps li.run{color:var(--fg)}.steps li.run::before{content:"⏳ "}.steps li.done{color:var(--ok)}.steps li.done::before{content:"✓ "}.steps li.err{color:var(--bad)}.steps li.err::before{content:"✕ "}
.tabs{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap}.tabs button{background:transparent;color:var(--fg);border:1px solid var(--line)}.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
canvas,svg{max-width:100%;height:auto;border-radius:8px;background:#fff}.view{overflow:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{color:var(--mut);font-weight:600}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.82rem;border:1px solid var(--line)}.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.warn{color:var(--warn);border-color:var(--warn)}.pill.bad{color:var(--bad);border-color:var(--bad)}
.legend span{margin-right:12px;white-space:nowrap}.sw{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:4px}
.note{color:var(--mut);font-size:.9rem}.hide{display:none}
</style>
</head>
<body>
<main>
<h1>Оцифровка листа — бета</h1>
<p class="sub">Фото листа с чертежом → цифровая копия в миллиметрах. Без вердикта: только «что нарисовано».</p>

<div class="card">
  <div class="row">
    <label class="btn" for="file">📷 Фото листа</label><input id="file" type="file" accept="image/*">
    <button id="go" disabled>Оцифровать</button>
    <button id="demo" class="sec hide">Пример</button>
  </div>
  <div class="row" style="margin-top:10px">
    <label class="f">Задание <select id="dz"><option value="auto">авто</option><option value="2">ДЗ №2</option><option value="3">ДЗ №3</option></select></label>
    <label class="f">Вариант <input id="variant" type="text" value="авто" size="4" title="число 1–30 или «авто»"></label>
    <label class="f hide" id="pwrow">Пароль <input id="pw" type="password"></label>
  </div>
  <p class="note" id="priv">Кадры чертежей отправляются модели Claude (через ProxyAPI). Сервер фото не сохраняет.</p>
  <p class="note" id="status"></p>
</div>

<div class="card hide" id="prog"><ul class="steps" id="steps"></ul></div>

<div class="card hide" id="res">
  <div class="tabs" id="tabs"><button data-t="ov" class="on">На фото</button><button data-t="svg">Цифровая копия</button><button data-t="tab">Показатели</button></div>
  <div class="legend note" id="legend"><span><i class="sw" style="background:#1f9d3a"></i>подтверждено карандашом</span><span><i class="sw" style="background:#e07b00"></i>не подтверждено</span><span><i class="sw" style="background:#2f6bff"></i>найдено сверх модели</span><span><i class="sw" style="background:#c0005a"></i>точка</span></div>
  <div class="view" id="vOv"><canvas id="cv"></canvas></div>
  <div class="view hide" id="vSvg"></div>
  <div class="view hide" id="vTab"></div>
  <div class="row" style="margin-top:10px"><button class="sec" id="dSvg">Скачать SVG</button><button class="sec" id="dJson">Скачать JSON</button></div>
</div>
</main>

<script>
/* страница читает те же модули, что и воркер сканера; порядок как в lab/dz/worker.js */
const LIBS=['../../core/dz.js','../../core/dz-variants.js','../img.js','../clean.js','../font.js','../sheets.js','../rectify.js','../lines.js',
 '../dz/sheet.js','../dz/locate.js','../dz/digitize.js','../dz/model.js','../dz/model3.js','../dz/calib.js','../dz/check2.js','../dz/check3.js','../dz/explain2.js','../dz/report2.js','../dz/check.js','../dz/grid.js','../dz/given.js','../dz/explain3d.js','../dz/report3d.js','../dz/paper.js','../dz/gridsheet.js','../dz/series.js','../dz/refine.js','../dz/eyes.js','../dz/layout.js','../dz/sheetlib.js'];
</script>
<script>LIBS.forEach(s=>document.write('<script src="'+s+'?v=beta1"><\/script>'));</script>
<script>
(function(){
const $=id=>document.getElementById(id), L=self.LAB;
let file=null, RES=null, PASS=sessionStorage.getItem('betaPass')||'';
try{}catch(e){}
fetch('/api/status').then(r=>r.json()).then(j=>{ $('status').textContent='Сервер: раскладка — '+(j.layout||'?').split('/').pop()+', оцифровка — '+(j.digit||'?').split('/').pop()+'; потрачено $'+j.spent+' из $'+j.limit; if(j.passwordNeeded) $('pwrow').classList.remove('hide'); }).catch(()=>{ $('status').textContent='Нет связи с сервером беты (запущен ли lab/dz/beta-server.js?)'; });
$('pw').value=PASS; $('pw').onchange=()=>{ PASS=$('pw').value; try{ sessionStorage.setItem('betaPass',PASS); }catch(e){} };
$('file').onchange=e=>{ file=e.target.files[0]||null; $('go').disabled=!file; if(file) $('go').textContent='Оцифровать «'+(file.name.length>22?file.name.slice(0,20)+'…':file.name)+'»'; };
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b)); ['Ov','Svg','Tab'].forEach(k=>$('v'+k).classList.toggle('hide',b.dataset.t!==k.toLowerCase())); $('legend').classList.toggle('hide',b.dataset.t==='tab'); });

const steps=[]; function step(id,text,state){ let li=steps.find(s=>s.id===id); if(!li){ li={id,el:document.createElement('li')}; steps.push(li); $('steps').appendChild(li.el); } li.el.textContent=text; li.el.className=state||'run'; }
const fmt=(a,d)=>isFinite(a)?a.toFixed(d==null?2:d).replace('.',','):'—';

async function ask(mode,canvas,q){ const url=canvas.toDataURL('image/jpeg',0.85), r=await fetch('/api/eyes',{method:'POST',headers:{'content-type':'application/json','x-beta-password':PASS},body:JSON.stringify({img:url,w:canvas.width,h:canvas.height,mode})});
  const j=await r.json().catch(()=>({ok:false,error:'сервер ответил не JSON'})); if(!r.ok||!j.ok) throw new Error(j.error||('ошибка '+r.status)); return j; }
function scaled(bmp,side){ const k=Math.min(1,side/Math.max(bmp.width,bmp.height)), c=document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k); c.getContext('2d').drawImage(bmp,0,0,c.width,c.height); return {c,k}; }
/* вырезка чертежа: рамка + поле, поворот по часовой на rot, длинная сторона ≤ side; A — (u,v) вырезки → (x,y) фото (как lab/dz/tools/crop.py) */
function cut(bmp,box,rot,pad,side){ const W=bmp.width,H=bmp.height, X0=Math.max(0,Math.round(box[0]-pad)), Y0=Math.max(0,Math.round(box[1]-pad)), X1=Math.min(W,Math.round(box[2]+pad)), Y1=Math.min(H,Math.round(box[3]+pad)), cw=X1-X0, ch=Y1-Y0;
  const sw=(rot===90||rot===270)?ch:cw, sh=(rot===90||rot===270)?cw:ch, r=document.createElement('canvas'); r.width=sw; r.height=sh; const g=r.getContext('2d');
  if(rot===90){ g.translate(ch,0); g.rotate(Math.PI/2); } else if(rot===180){ g.translate(cw,ch); g.rotate(Math.PI); } else if(rot===270){ g.translate(0,cw); g.rotate(-Math.PI/2); }
  g.drawImage(bmp,X0,Y0,cw,ch,0,0,cw,ch); const k=Math.min(1,side/Math.max(sw,sh)), c=document.createElement('canvas'); c.width=Math.round(sw*k); c.height=Math.round(sh*k); c.getContext('2d').drawImage(r,0,0,c.width,c.height);
  const M={0:[1,0,0,0,1,0],90:[0,1,0,-1,0,ch],180:[-1,0,cw,0,-1,ch],270:[0,-1,cw,1,0,0]}[rot], A=[M[0]/k,M[1]/k,M[2]+X0,M[3]/k,M[4]/k,M[5]+Y0];
  const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data, gray=new Float32Array(c.width*c.height); for(let i=0;i<gray.length;i++) gray[i]=0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2];
  return {c,w:c.width,h:c.height,A,k,gray}; }
const mapPt=(A,u,v)=>[A[0]*u+A[1]*v+A[2],A[3]*u+A[4]*v+A[5]];

async function run(){ const LY=L.layout, SL=L.sheetlib, RF=L.refine, IMG=L.img; $('go').disabled=true; $('prog').classList.remove('hide'); $('res').classList.add('hide'); $('steps').innerHTML=''; steps.length=0; let cost=0, calls=0;
  const t0=Date.now(); try{
    step('l','Читаю фото…'); const bmp=await createImageBitmap(file,{imageOrientation:'from-image'}); const W=bmp.width,H=bmp.height; step('l','Фото '+W+' × '+H+' px','done');
    step('lay','Нахожу чертежи на листе…'); const sm=scaled(bmp,800); let lay; try{ const j=await ask('layout',sm.c); cost+=j.cost||0; calls++; lay=LY.parseLayout(j.text,1/sm.k,W,H); }catch(e){ lay={ok:false,why:e.message}; }
    if(!lay.ok){ step('lay','Раскладка не помогла ('+lay.why+') — лист как один чертёж','done'); lay={ok:true,rot:0,drawings:[{box:[0,0,W,H],part:null}]}; } else step('lay','Чертежей: '+lay.drawings.length+(lay.rot?', лист повёрнут на '+lay.rot+'°':'')+(lay.drawings.some(d=>d.part)?' (части '+lay.drawings.map(d=>d.part||'?').join(', ')+')':''),'done');
    const dzSel=$('dz').value==='auto'?null:+$('dz').value, vSel=/^\d+$/.test($('variant').value.trim())?$('variant').value.trim():'auto';
    const out={name:file.name.replace(/\.[^.]+$/,''),size:[W,H],layout:{rot:lay.rot,n:lay.drawings.length},drawings:[]};
    const jobs=lay.drawings.map((d,i)=>async()=>{ const id='d'+i; step(id,'Чертёж '+(i+1)+': оцифровка…'); const cr=cut(bmp,d.box,lay.rot,Math.max(40,0.05*Math.max(d.box[2]-d.box[0],d.box[3]-d.box[1])),1200);
      let j; try{ j=await ask('crop',cr.c); }catch(e){ step(id,'Чертёж '+(i+1)+': '+e.message,'err'); return {part:d.part,box:d.box,error:e.message}; } cost+=j.cost||0; calls++;
      const P=LY.parseDigit(j.text); let fit=null; try{ fit=SL.fitVariant(j.text,vSel,dzSel); }catch(e){}
      const rg=P.pts.length>=4?[Math.min(...P.pts.map(q=>q[1])),Math.min(...P.pts.map(q=>q[2])),Math.max(...P.pts.map(q=>q[1])),Math.max(...P.pts.map(q=>q[2]))]:null;
      const ppm=Math.max(2,Math.min(W,H)/210*cr.k), rf=RF.refine({w:cr.w,h:cr.h,a:cr.gray},P.segs,{circles:P.circles,findCircles:true,ppm:fit&&fit.ppm?fit.ppm:ppm,region:rg,points:P.pts.map(q=>[q[1],q[2]]),findCap:0.35});
      let toMm=null; if(fit&&fit.M){ const Mi=IMG.H.inv(fit.M); toMm=(x,y)=>IMG.H.apply(Mi,[x,y]); } else if(fit&&fit.A){ const a=fit.A, det=a[0]*a[4]-a[1]*a[3]; if(Math.abs(det)>1e-9) toMm=(x,y)=>{ const X=x-a[2], Y=y-a[5]; return [(a[4]*X-a[1]*Y)/det,(-a[3]*X+a[0]*Y)/det]; }; }
      const mmCopy=toMm?{pts:P.pts.map(q=>[q[0]].concat(toMm(q[1],q[2]).map(v=>+v.toFixed(2)))),segs:rf.segs.map(q=>({p:toMm(q.p[0],q.p[1]).concat(toMm(q.p[2],q.p[3])).map(v=>+v.toFixed(2)),src:q.src,unverified:!!q.unverified,dash:!!q.dash}))}:null;
      const circles=(rf.circles||[]).map(c=>{ const poly=SL.arcPoints(c); return {src:c.src,unverified:!!c.unverified,dash:!!c.dash,full:!!c.full,c:[c.cx,c.cy,c.r].map(v=>+v.toFixed(2)),a:c.full?null:[+c.a1.toFixed(1),+c.a2.toFixed(1)],poly:poly.map(([u,v])=>mapPt(cr.A,u,v).map(t=>+t.toFixed(1))),mm:toMm?poly.map(([u,v])=>toMm(u,v).map(t=>+t.toFixed(2))):null}; });
      const dr={part:d.part,box:d.box,rot:lay.rot,mm:mmCopy,circles,fit,pts:P.pts.map(q=>[q[0]].concat(mapPt(cr.A,q[1],q[2]))),segs:rf.segs.map(q=>({p:mapPt(cr.A,q.p[0],q.p[1]).concat(mapPt(cr.A,q.p[2],q.p[3])),src:q.src,unverified:!!q.unverified,dash:!!q.dash})),stats:Object.assign({model:P.segs.length,bad:P.bad,pts:P.pts.length},rf.stats)};
      step(id,'Чертёж '+(i+1)+': точек '+P.pts.length+', отрезков '+rf.stats.kept+(circles.length?', окружностей и дуг '+circles.length:'')+(fit&&fit.rmsMm!=null?', привязка ДЗ №'+fit.dz+' в.'+fit.n+', невязка '+fmt(fit.hom?fit.hom.rmsMm:fit.rmsMm)+' мм':', к условию не привязался'),'done'); return dr; });
    /* до двух чертежей одновременно */
    const q=jobs.slice(); const workers=[0,1].map(async()=>{ while(q.length){ const job=q.shift(), idx=jobs.indexOf(job); out.drawings[idx]=await job(); } }); await Promise.all(workers);
    out.cost=+cost.toFixed(4); out.calls=calls; out.seconds=Math.round((Date.now()-t0)/1000); RES={out,bmp,svg:SL.svgOf(out)}; show(); }
  catch(e){ step('x','Сбой: '+e.message,'err'); } $('go').disabled=false; }

function show(){ const {out,bmp,svg}=RES; $('res').classList.remove('hide');
  /* на фото */
  const cv=$('cv'), k=Math.min(1,1100/bmp.width); cv.width=Math.round(bmp.width*k); cv.height=Math.round(bmp.height*k); const g=cv.getContext('2d'); g.drawImage(bmp,0,0,cv.width,cv.height); g.globalAlpha=1; g.lineCap='round';
  out.drawings.forEach(d=>{ if(!d.segs) return; d.segs.forEach(s=>{ g.strokeStyle=s.src==='found'?'#2f6bff':s.unverified?'#e07b00':'#1f9d3a'; g.lineWidth=s.src==='found'?1.2:1.8; g.setLineDash(s.dash?[6,4]:s.unverified?[4,3]:[]); g.beginPath(); g.moveTo(s.p[0]*k,s.p[1]*k); g.lineTo(s.p[2]*k,s.p[3]*k); g.stroke(); }); g.setLineDash([]);
    (d.circles||[]).forEach(c=>{ g.strokeStyle=c.src==='found'?'#2f6bff':c.unverified?'#e07b00':'#1f9d3a'; g.lineWidth=1.8; g.setLineDash(c.dash?[6,4]:c.unverified?[4,3]:[]); g.beginPath(); (c.poly||[]).forEach((q,i)=>i?g.lineTo(q[0]*k,q[1]*k):g.moveTo(q[0]*k,q[1]*k)); g.stroke(); }); g.setLineDash([]);
    d.pts.forEach(p=>{ g.fillStyle='#c0005a'; g.beginPath(); g.arc(p[1]*k,p[2]*k,2.5,0,7); g.fill(); }); });
  $('vSvg').innerHTML=svg||'<p class="note">Не из чего строить копию: у модели нет отрезков.</p>';
  /* показатели */
  const rows=out.drawings.map((d,i)=>{ if(!d.segs) return '<tr><td>'+(i+1)+'</td><td colspan="5"><span class="pill bad">'+(d.error||'ошибка')+'</span></td></tr>'; const f=d.fit, s=d.stats, conf=s.kept?Math.round(100*(s.kept-s.unverified)/s.kept):0;
    return '<tr><td>'+(i+1)+(d.part?' · часть '+d.part:'')+'</td><td>'+(f&&f.rmsMm!=null?'ДЗ №'+f.dz+', вариант '+f.n:'<span class="pill warn">не привязан</span>')+'</td><td>'+(f&&f.rmsMm!=null?fmt(f.hom?f.hom.rmsMm:f.rmsMm)+' мм ('+f.inl+' из '+f.of+' точек)':'—')+'</td><td>'+(f&&f.ppm?fmt(f.ppm,1)+' px/мм':'—')+'</td><td>'+s.pts+' / '+s.kept+((d.circles||[]).length?' / '+d.circles.length+' окр.':'')+'</td><td><span class="pill '+(conf>=85?'ok':conf>=60?'warn':'bad')+'">'+conf+' %</span>'+(s.dropped?' · отброшено '+s.dropped:'')+(s.found?' · найдено сверх модели '+s.found:'')+'</td></tr>'; }).join('');
  const low=out.drawings.some(d=>d.fit&&d.fit.ppm&&d.fit.ppm<5);
  $('vTab').innerHTML='<table><tr><th>Чертёж</th><th>Привязка к условию</th><th>Невязка точек условия</th><th>Разрешение</th><th>Точек / отрезков / окружностей</th><th>Подтверждено карандашом</th></tr>'+rows+'</table><p class="note">Невязка — на сколько точки, которые выписала модель, не совпали с известной геометрией варианта; это проверка точек заданной фигуры, не линий построения. '+(low?'<b>Снимок далековат (меньше 5 px/мм): ближе и ровнее — точнее.</b> ':'')+'Оценка расхода ≈ $'+out.cost.toFixed(3)+', запросов '+out.calls+', '+out.seconds+' с.</p>'; }

$('go').onclick=run;
const dl=(name,type,text)=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); };
$('dSvg').onclick=()=>RES&&RES.svg&&dl(RES.out.name+'.svg','image/svg+xml',RES.svg);
$('dJson').onclick=()=>RES&&dl(RES.out.name+'.json','application/json',JSON.stringify(RES.out));
window.__beta={get res(){ return RES; },run:async f=>{ file=f; await run(); return RES; }};
})();
</script>
</body>
</html>
