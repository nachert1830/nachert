<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07112a" media="(prefers-color-scheme: dark)">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://functions.yandexcloud.net wss://broker.emqx.io:8084 wss://broker.hivemq.com:8884; worker-src 'self' blob:; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>Начерт · датчик рук</title>
<link rel="stylesheet" href="hands.css">
<style>
  /* страница-датчик в оформлении сайта (переменные — из hands.css: светлая/тёмная тема по системе) */
  body{overflow:auto}
  .sensor{position:static;min-height:100%;display:flex;flex-direction:column;align-items:center;gap:16px;padding:22px 18px calc(22px + env(safe-area-inset-bottom));text-align:center}
  .sensor .logo{display:flex;align-items:center;gap:8px;font:800 15px/1 var(--ui);letter-spacing:.24em;color:var(--navy)}
  .sensor h1{font:700 22px/1.25 var(--ui);margin:4px 0 0;color:var(--ink)}
  .sensor p{margin:0;color:var(--mut);font-size:14px;max-width:420px}
  .sensor .big{font:700 17px var(--ui);padding:15px 30px;border-radius:99px;border:0;background:var(--red);color:#fff;box-shadow:0 8px 20px -8px rgba(217,34,42,.6)}
  .sensor .sm{font:600 13px var(--body);padding:9px 14px;border-radius:10px;border:1px solid var(--acc);background:none;color:var(--acc)}
  #prev{position:relative;width:min(80vw,360px);aspect-ratio:4/3;border-radius:14px;border:3px solid var(--line);overflow:hidden;background:#000}
  #prev.see{border-color:var(--ok)} #prev.miss{border-color:var(--red)}
  #prev video,#prev canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #see{font:700 17px var(--ui);padding:10px 18px;border-radius:12px;background:var(--blue-s);color:var(--ink)}
  #see.ok{background:var(--ok);color:#fff} #see.no{background:var(--red);color:#fff}
  #stat{font:500 12px var(--mono);color:var(--mut)}
  .sensor .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:0}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main class="sensor">
  <span class="logo"><span class="tri" aria-hidden="true"><i></i><i></i><i></i></span>НАЧЕРТ</span>
  <h1 id="title">Телефон — датчик рук</h1>
  <p id="lead">Камера и распознавание рук работают на телефоне, на ноутбук уходят только координаты пальцев — видео не покидает телефон.</p>
  <button id="start" class="big" type="button">Начать</button>
  <div id="prev" hidden><video id="vid" playsinline muted></video><canvas id="ov"></canvas></div>
  <div id="see" role="status" hidden></div>
  <div id="stat"></div>
  <div class="row"><button id="flip" class="sm" type="button" hidden>🔄 Другая камера</button><button id="stop" class="sm" type="button" hidden>Остановить</button></div>
  <p id="tip" hidden>Положи телефон горизонтально у монитора, камерой к себе. Экран не погаснет, пока страница открыта.</p>
</main>
<script type="module" src="sensor.js"></script>
</body>
</html>
