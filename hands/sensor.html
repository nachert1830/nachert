<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#03060c">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://ntfy.sh; worker-src 'self' blob:; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>Начерт · датчик рук</title>
<link rel="stylesheet" href="hands.css">
<style>
  body{overflow:auto}
  .sensor{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:16px;padding:22px 18px calc(22px + env(safe-area-inset-bottom));text-align:center}
  .sensor .logo{font:700 15px/1 var(--ui);letter-spacing:.32em;color:var(--cy);text-shadow:0 0 14px rgba(53,224,255,.55)}
  .sensor h1{font:600 22px/1.25 var(--ui);margin:4px 0 0}
  .sensor p{margin:0;color:var(--mut);font-size:14px;max-width:420px}
  .sensor .big{font:600 17px var(--ui);padding:14px 26px;border-radius:99px;border:1px solid var(--cy);background:rgba(53,224,255,.12);color:var(--txt)}
  .sensor .sm{font:500 13px var(--body);padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--mut)}
  #qr{background:#fff;padding:14px;border-radius:12px;width:min(86vw,420px);height:auto;image-rendering:pixelated}
  #prev{position:relative;width:min(70vw,320px);aspect-ratio:4/3;border:1px solid var(--line2);overflow:hidden;background:#000;
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
  #prev video,#prev canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  #stat{font:500 13px var(--mono);color:var(--ok)}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main class="sensor">
  <span class="logo">НАЧЕРТ</span>
  <h1 id="title">Телефон — датчик рук</h1>
  <p id="lead">Камера и распознавание рук работают на телефоне, на ноутбук уходят только координаты пальцев — видео не покидает телефон.</p>
  <button id="start" class="big" type="button">Начать</button>
  <div id="prev" hidden><video id="vid" playsinline muted></video><canvas id="ov"></canvas></div>
  <div id="stat" role="status"></div>
  <div class="row"><button id="flip" class="sm" type="button" hidden>🔄 Другая камера</button><button id="stop" class="sm" type="button" hidden>Остановить</button></div>
  <p id="tip" hidden>Положи телефон горизонтально у монитора, камерой к себе. Экран не погаснет, пока страница открыта.</p>
</main>
<script type="module" src="sensor.js"></script>
</body>
</html>
