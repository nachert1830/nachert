<style>
/* FONTS */
@font-face{font-family:'Geologica';font-weight:400 700;font-display:swap;src:url(../../fonts/geologica-cyrillic.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Geologica';font-weight:400 700;font-display:swap;src:url(../../fonts/geologica-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2212}
@font-face{font-family:'Golos Text';font-weight:400 700;font-display:swap;src:url(../../fonts/golos-text-cyrillic.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Golos Text';font-weight:400 700;font-display:swap;src:url(../../fonts/golos-text-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2212}
@font-face{font-family:'NchGost';font-display:swap;src:url(../../fonts/osifont-italic.woff2) format('woff2')}
/* /FONTS */

/* ═══ «Связь» — дизайн-система Начерта. Концепция раскладки: одна колонка на телефоне, нижнее меню + наставник в центре;
       на компьютере — рейка слева, контент, наставник пристыкован справа. Цвет: графит + один фирменный «Сурик». ═══ */
:root{
  --bg:#F3F4F6;--surface-1:#FFFFFF;--surface-2:#EBEDF1;--surface-3:#DFE2E8;--overlay:#FFFFFF;
  --line:#DDE1E7;--line-strong:#B9C0CB;--field:#7F8795;
  --ink-1:#0E1116;--ink-2:#434B58;--ink-3:#5F6877;--ink-4:#9AA2AE;
  --accent:#EB5310;--accent-ink:#1A0A02;--accent-text:#B93A06;--accent-soft:#FFE8DD;
  --ok:#10743F;--ok-soft:#E2F4E8;--err:#C4183E;--err-soft:#FCE4EA;
  --due:#8A5300;--due-fill:#FFC43D;--due-soft:#FFF1CC;--focus:#B93A06;
  --draw-paper:#FFFFFF;--draw-grid:#E8EBF0;--draw-ink:#14171C;--draw-thin:#7C8594;--draw-build:#EB5310;
  --shadow-2:0 8px 24px rgba(14,17,22,.08),0 1px 2px rgba(14,17,22,.06);
  --shadow-3:0 24px 64px rgba(14,17,22,.16);
  --scrim:rgba(14,17,22,.32);
  --glass:rgba(243,244,246,.86);
  --font-display:'Geologica','Golos Text',system-ui,sans-serif;
  --font-text:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-drawing:'NchGost','Golos Text',sans-serif;
  --d-micro:150ms;--d-small:200ms;--d-medium:250ms;--d-sheet:320ms;--d-page:400ms;--d-draw:600ms;
  --e-standard:cubic-bezier(.2,0,0,1);--e-enter:cubic-bezier(0,0,0,1);--e-exit:cubic-bezier(.3,0,1,1);--e-draw:cubic-bezier(.65,0,.35,1);
  --spring-snappy:linear(0,.066,.205,.362,.508,.632,.732,.809,.867,.909,.939,.959,.974,.983,.99,1);
  --spring-smooth:linear(0,.034,.114,.215,.32,.423,.516,.599,.671,.732,.783,.825,.86,.888,.911,.93,.944,.956,.966,.973,.979,.983,.987,.99,.992,1);
  --spring-bouncy:linear(0,.057,.194,.37,.553,.722,.863,.971,1.046,1.09,1.11,1.112,1.101,1.083,1.063,1.042,1.024,1.01,.999,.992,.989,.987,.988,.989,.992,1);
  --tabbar:64px;--gutter-l:max(16px,env(safe-area-inset-left,0px));--gutter-r:max(16px,env(safe-area-inset-right,0px));
  --sab:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0D11;--surface-1:#14171D;--surface-2:#1C2028;--surface-3:#272C36;--overlay:#1A1E25;
  --line:#262B34;--line-strong:#3B424F;--field:#606979;
  --ink-1:#F1F3F6;--ink-2:#B3BAC6;--ink-3:#8E97A6;--ink-4:#555D6B;
  --accent:#FF6A2B;--accent-ink:#1A0A02;--accent-text:#FF8F5E;--accent-soft:#35190C;
  --ok:#4CD38A;--ok-soft:#0F2C1D;--err:#FF6F8E;--err-soft:#371320;
  --due:#FFCB5C;--due-fill:#FFC43D;--due-soft:#33270B;--focus:#FF8F5E;
  --draw-paper:#101318;--draw-grid:#1A1E25;--draw-ink:#E9ECF1;--draw-thin:#7D8696;--draw-build:#FF6A2B;
  --shadow-2:inset 0 1px 0 rgba(255,255,255,.04),0 0 0 1px #262B34;--shadow-3:0 24px 64px rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.56);--glass:rgba(11,13,17,.82);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0D11;--surface-1:#14171D;--surface-2:#1C2028;--surface-3:#272C36;--overlay:#1A1E25;
  --line:#262B34;--line-strong:#3B424F;--field:#606979;
  --ink-1:#F1F3F6;--ink-2:#B3BAC6;--ink-3:#8E97A6;--ink-4:#555D6B;
  --accent:#FF6A2B;--accent-ink:#1A0A02;--accent-text:#FF8F5E;--accent-soft:#35190C;
  --ok:#4CD38A;--ok-soft:#0F2C1D;--err:#FF6F8E;--err-soft:#371320;
  --due:#FFCB5C;--due-fill:#FFC43D;--due-soft:#33270B;--focus:#FF8F5E;
  --draw-paper:#101318;--draw-grid:#1A1E25;--draw-ink:#E9ECF1;--draw-thin:#7D8696;--draw-build:#FF6A2B;
  --shadow-2:inset 0 1px 0 rgba(255,255,255,.04),0 0 0 1px #262B34;--shadow-3:0 24px 64px rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.56);--glass:rgba(11,13,17,.82);color-scheme:dark}
:root[data-motion="reduce"]{--d-micro:1ms;--d-small:1ms;--d-medium:120ms;--d-sheet:120ms;--d-page:120ms;--d-draw:1ms;
  --spring-snappy:linear(0,1);--spring-smooth:linear(0,1);--spring-bouncy:linear(0,1)}
@media (prefers-reduced-motion:reduce){:root{--d-micro:1ms;--d-small:1ms;--d-medium:120ms;--d-sheet:120ms;--d-page:120ms;--d-draw:1ms;
  --spring-snappy:linear(0,1);--spring-smooth:linear(0,1);--spring-bouncy:linear(0,1)}}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink-1);font:400 15px/22px var(--font-text);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;text-rendering:optimizeLegibility}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
svg{display:block}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.s{width:20px;height:20px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

/* ── type ── */
.t-dl{font:650 40px/44px var(--font-display);letter-spacing:-.02em;text-wrap:balance;margin:0}
.t-dm{font:650 30px/34px var(--font-display);letter-spacing:-.015em;text-wrap:balance;margin:0}
.t-tl{font:600 24px/30px var(--font-display);letter-spacing:-.01em;text-wrap:balance;margin:0}
.t-tm{font:600 20px/26px var(--font-display);letter-spacing:-.005em;margin:0}
.t-ts{font:600 17px/22px var(--font-text);margin:0}
.t-bl{font:400 17px/26px var(--font-text);margin:0}
.t-b{font:400 15px/22px var(--font-text);margin:0}
.t-lb{font:550 15px/20px var(--font-text)}
.t-c{font:450 13px/18px var(--font-text);color:var(--ink-3);margin:0}
.t-o{font:600 12px/16px var(--font-text);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0}
.ink2{color:var(--ink-2)}

/* ── shell ── */
.app{min-height:100vh;min-height:100dvh}
.rail{display:none}
.dock{display:none}
.view{max-width:720px;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:0 calc(var(--tabbar) + 88px + var(--sab))}
.view.focus{padding-block-end:calc(96px + var(--sab))}
.screen{animation:scr-in var(--d-medium) var(--e-enter) backwards}
.screen.back{animation-name:scr-back}
@keyframes scr-in{from{opacity:0;transform:translateY(8px)}}
@keyframes scr-back{from{opacity:0;transform:translateY(-6px)}}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:8px;height:56px;margin-left:calc(-1 * var(--gutter-l));margin-right:calc(-1 * var(--gutter-r));padding-left:calc(var(--gutter-l) - 6px);padding-right:calc(var(--gutter-r) - 6px);background:var(--glass);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.topbar .ttl{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.topbar .ttl b{font:600 16px/20px var(--font-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .ttl span{font:450 12px/16px var(--font-text);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wordmark{display:flex;align-items:center;gap:8px;font:650 19px/1 var(--font-display);letter-spacing:-.02em;padding-left:6px;flex:1}
.wordmark svg{width:22px;height:22px}

/* ── buttons ── */
.btn{--h:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--h);padding:0 20px;border-radius:14px;font:600 15px/20px var(--font-text);transition:transform var(--d-micro) var(--spring-snappy),background-color var(--d-micro) var(--e-standard),color var(--d-micro);position:relative;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.4;pointer-events:none}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.sec{background:var(--surface-2);color:var(--ink-1)}
.btn.sec:hover{background:var(--surface-3)}
.btn.ghost{color:var(--ink-1);padding:0 12px}
.btn.ghost:hover{background:var(--surface-2)}
.btn.l{--h:52px;font-size:16px;border-radius:16px}
.btn.s{--h:36px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.wide{width:100%}
.btn.loading{color:transparent!important}
.btn.loading::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;border:2px solid var(--accent-ink);border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ibtn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:12px;flex:none;transition:transform var(--d-micro) var(--spring-snappy),background-color var(--d-micro)}
.ibtn:hover{background:var(--surface-2)}
.ibtn:active{transform:scale(.92)}
.ibtn.fill{background:var(--surface-2)}
.ibtn.acc{background:var(--accent);color:var(--accent-ink);border-radius:50%}
.link{color:var(--accent-text);font-weight:550;display:inline-flex;align-items:center;gap:4px;min-height:44px}

/* ── chips / pills ── */
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;background:var(--surface-2);font:550 14px/18px var(--font-text);color:var(--ink-1);transition:background-color var(--d-micro),transform var(--d-micro) var(--spring-snappy);white-space:nowrap}
.chip:hover{background:var(--surface-3)}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--ink-1);color:var(--bg)}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font:600 12px/1 var(--font-text);letter-spacing:.01em;white-space:nowrap}
.pill .ic{width:14px;height:14px;stroke-width:2}
.pill.due{background:var(--due-soft);color:var(--due)}
.pill.due.hot{background:var(--due-fill);color:var(--accent-ink)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.err{background:var(--err-soft);color:var(--err)}
.pill.neu{background:var(--surface-2);color:var(--ink-2)}
.pill.acc{background:var(--accent-soft);color:var(--accent-text)}

/* ── cards ── */
.card{background:var(--surface-1);border-radius:20px;box-shadow:0 0 0 1px var(--line)}
:root[data-theme="dark"] .card{box-shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card{box-shadow:none}}
.tap{transition:transform var(--d-small) var(--spring-snappy);cursor:pointer;text-align:left;display:block;width:100%}
.tap:active{transform:scale(.98)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:32px 0 12px}
.sec-h h2{font:600 20px/26px var(--font-display);letter-spacing:-.005em;margin:0}

/* covers: фирменная графика — сетка листа + линии построения + одна линия «Сурик» */
.cover{position:relative;background:var(--draw-paper);overflow:hidden}
.cover svg{width:100%;height:100%}
.cv-grid{stroke:var(--draw-grid);stroke-width:1}
.cv-ink{stroke:var(--draw-ink);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.cv-thin{stroke:var(--draw-thin);stroke-width:.9;fill:none}
.cv-dash{stroke:var(--draw-thin);stroke-width:.9;fill:none;stroke-dasharray:10 2.5 1.5 2.5}
.cv-hid{stroke:var(--draw-ink);stroke-width:1.1;fill:none;stroke-dasharray:4 3}
.cv-acc{stroke:var(--draw-build);stroke-width:2.2;fill:none;stroke-linecap:round}
.cv-hatch{stroke:var(--draw-thin);stroke-width:.8}
.cv-dot{fill:var(--draw-ink)}
.cv-adot{fill:var(--draw-build)}

/* progress */
.bar{height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:inherit;transform-origin:left;animation:grow var(--d-page) var(--spring-smooth) both}
@keyframes grow{from{transform:scaleX(0)}}
.segs{display:flex;gap:3px}
.segs i{flex:1;height:4px;border-radius:2px;background:var(--surface-3);position:relative;overflow:hidden}
.segs i.done{background:var(--ink-1)}
.segs i.cur{background:var(--surface-3)}
.segs i.cur::after{content:"";position:absolute;inset:0;background:var(--accent);transform-origin:left;transform:scaleX(.45)}

/* ── HOME ── */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:4px}
.orb{width:168px;height:168px;touch-action:manipulation;cursor:pointer;border-radius:50%}
.hero .orb{margin:0 auto 2px}
.hero h1{margin-top:4px}
.hero .lead{margin:8px 0 20px;color:var(--ink-2);font:400 15px/22px var(--font-text);max-width:30ch}
.omni{position:relative;width:100%;display:flex;align-items:center;gap:4px;min-height:56px;padding:6px 6px 6px 18px;border-radius:20px;background:var(--surface-1);box-shadow:0 0 0 1px var(--field);transition:box-shadow var(--d-small) var(--e-standard)}
.omni:focus-within{box-shadow:0 0 0 2px var(--accent)}
.omni input{flex:1;min-width:0;height:44px;border:0;background:none;outline:none;font:400 17px/24px var(--font-text);color:var(--ink-1)}
.omni input::placeholder{color:var(--ink-3)}
.omni .send{transform:scale(0);transition:transform var(--d-small) var(--spring-bouncy)}
.omni.has .send{transform:scale(1)}
.omni .send:active{transform:scale(.9)}
.drop{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:15;background:var(--overlay);border-radius:20px;box-shadow:var(--shadow-3);padding:6px;text-align:left;animation:pop var(--d-small) var(--spring-snappy) both;transform-origin:top center}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-4px)}}
.res{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 10px;border-radius:14px;width:100%;text-align:left}
.res:hover,.res.on{background:var(--surface-2)}
.res .rb{flex:1;min-width:0}
.res .rb b{display:block;font:550 15px/20px var(--font-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .rb span{display:block;font:450 13px/18px var(--font-text);color:var(--ink-3)}
.res .ri{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--ink-2)}
.res.ask .ri{background:var(--accent-soft);color:var(--accent-text)}
mark{background:none;color:var(--accent-text);font-weight:650}
.starters{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-top:12px}
.starter{display:flex;flex-direction:column;gap:2px;min-height:64px;padding:12px 14px;border-radius:16px;background:var(--surface-2);text-align:left;transition:background-color var(--d-micro),transform var(--d-small) var(--spring-snappy)}
.starter:hover{background:var(--surface-3)}
.starter:active{transform:scale(.97)}
.starter b{font:550 14px/19px var(--font-text)}
.starter span{font:450 12px/16px var(--font-text);color:var(--ink-3)}

.now{padding:16px;margin-top:28px}
.now .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.now h3{margin:10px 0 2px}
.now .meta{display:flex;justify-content:space-between;margin:14px 0 8px}
.now .btn{margin-top:14px}

.shelf{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-left:calc(-1 * var(--gutter-l));margin-right:calc(-1 * var(--gutter-r));padding:2px var(--gutter-r) 8px var(--gutter-l);scrollbar-width:none;scroll-padding-left:var(--gutter-l)}
.shelf::-webkit-scrollbar{display:none}
.cont{flex:none;width:208px;scroll-snap-align:start}
.cont .cover{aspect-ratio:16/10;border-radius:16px;box-shadow:0 0 0 1px var(--line)}
.cont .cover .pg{position:absolute;left:0;right:0;bottom:0;height:3px;background:color-mix(in srgb,var(--ink-1) 12%,transparent)}
.cont .cover .pg i{display:block;height:100%;background:var(--accent)}
.cont b{display:block;margin-top:10px;font:550 15px/20px var(--font-text)}
.cont span{font:450 13px/18px var(--font-text);color:var(--ink-3)}

.subjects{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.subj{overflow:hidden;display:flex;flex-direction:column}
.subj .cover{aspect-ratio:1/1;border-radius:0}
.subj .sb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.subj h3{font:600 16px/20px var(--font-display);margin:0;letter-spacing:-.005em;text-wrap:balance}
.subj ul{list-style:none;margin:0;padding:0;font:450 13px/18px var(--font-text);color:var(--ink-3)}
.subj .bar{margin-top:auto}
.author{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;margin-top:28px}
.ava{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--ink-1);color:var(--bg);font:650 15px/1 var(--font-display);letter-spacing:.02em;position:relative;overflow:hidden}
.ava img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.author .ab{flex:1;min-width:0}
.author b{display:block;font:550 15px/20px var(--font-text)}
.foot{margin:24px 0 0;text-align:center}

/* ── TABBAR / NOWBAR ── */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:0 max(4px,env(safe-area-inset-right,0px)) var(--sab) max(4px,env(safe-area-inset-left,0px));height:calc(var(--tabbar) + var(--sab));background:var(--glass);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);box-shadow:0 -1px 0 var(--line);transition:transform var(--d-sheet) var(--spring-smooth)}
.tabbar.hide{transform:translateY(110%)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--tabbar);color:var(--ink-3);font:550 11px/14px var(--font-text);position:relative}
.tab[aria-current="page"]{color:var(--ink-1)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;width:20px;height:2px;border-radius:0 0 2px 2px;background:var(--accent);animation:tabline var(--d-small) var(--spring-snappy)}
@keyframes tabline{from{transform:scaleX(0)}}
.tab .ic{transition:transform var(--d-small) var(--spring-bouncy)}
.tab:active .ic{transform:scale(.88)}
.tab.agent canvas{width:44px;height:44px}
.nowbar{position:fixed;z-index:39;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:calc(var(--tabbar) + var(--sab) + 8px);display:flex;align-items:center;gap:10px;height:56px;padding:0 4px 0 8px;border-radius:16px;background:var(--overlay);box-shadow:var(--shadow-2);overflow:hidden;transition:transform var(--d-sheet) var(--spring-smooth),opacity var(--d-small)}
.nowbar.hide{transform:translateY(calc(100% + 80px));opacity:0;pointer-events:none}
.nowbar .cover{width:40px;height:40px;border-radius:10px;flex:none;box-shadow:0 0 0 1px var(--line)}
.nowbar .nb{flex:1;min-width:0;text-align:left}
.nowbar .nb b{display:block;font:600 14px/18px var(--font-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowbar .nb span{display:block;font:450 12px/16px var(--font-text);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowbar .np{position:absolute;left:0;bottom:0;height:2px;background:var(--accent)}

/* ── SHEET / TOAST ── */
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);animation:fade var(--d-sheet) var(--e-standard) both}
.scrim.out{animation:fadeout var(--d-small) var(--e-exit) both}
@keyframes fade{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
.sheet{position:fixed;z-index:61;left:0;right:0;bottom:0;max-height:88dvh;overflow:auto;background:var(--overlay);border-radius:28px 28px 0 0;padding:8px var(--gutter-r) calc(24px + var(--sab)) var(--gutter-l);box-shadow:var(--shadow-3);animation:sheet-in var(--d-sheet) var(--spring-smooth) both;max-width:560px;margin:0 auto;overscroll-behavior:contain}
.sheet.out{animation:sheet-out var(--d-small) var(--e-exit) both}
@keyframes sheet-in{from{transform:translateY(100%)}}
@keyframes sheet-out{to{transform:translateY(100%)}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--surface-3);margin:0 auto 12px}
.toast{position:fixed;z-index:70;left:50%;bottom:calc(var(--tabbar) + var(--sab) + 76px);transform:translateX(-50%);display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);padding:12px 16px;border-radius:14px;background:var(--ink-1);color:var(--bg);font:550 14px/18px var(--font-text);box-shadow:var(--shadow-3);animation:toast-in var(--d-medium) var(--spring-bouncy) both}
.toast.out{animation:toast-out var(--d-small) var(--e-exit) both}
.toast .ic{width:20px;height:20px}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,16px) scale(.96)}}
@keyframes toast-out{to{opacity:0;transform:translate(-50%,8px)}}

/* ── tabs (segmented with sliding indicator) ── */
.seg{position:relative;display:flex;padding:3px;border-radius:14px;background:var(--surface-2);gap:0}
.seg button{position:relative;z-index:1;flex:1;min-height:38px;padding:0 12px;border-radius:11px;font:550 14px/18px var(--font-text);color:var(--ink-2);transition:color var(--d-small)}
.seg button[aria-selected="true"]{color:var(--ink-1)}
.seg .ind{position:absolute;z-index:0;top:3px;bottom:3px;border-radius:11px;background:var(--surface-1);box-shadow:0 1px 3px rgba(0,0,0,.12);transition:transform var(--d-medium) var(--spring-snappy),width var(--d-medium) var(--spring-snappy)}
.utabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-left:calc(-1 * var(--gutter-l));margin-right:calc(-1 * var(--gutter-r));padding:0 var(--gutter-r) 0 var(--gutter-l);border-bottom:1px solid var(--line);position:relative}
.utabs::-webkit-scrollbar{display:none}
.utabs button{min-height:48px;padding:0 12px;font:550 15px/20px var(--font-text);color:var(--ink-3);white-space:nowrap;position:relative}
.utabs button[aria-selected="true"]{color:var(--ink-1)}
.utabs button[aria-selected="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--accent);border-radius:2px;animation:tabline var(--d-small) var(--spring-snappy)}

/* ── SUBJECT ── */
.shero{margin-left:calc(-1 * var(--gutter-l));margin-right:calc(-1 * var(--gutter-r));position:relative}
.shero .cover{height:168px}
.shero .st{padding:16px var(--gutter-r) 8px var(--gutter-l)}
.shero .st .t-c{margin-top:4px}
.dzlist{display:grid;gap:12px;margin-top:16px}
.dz{display:flex;gap:14px;padding:12px;align-items:stretch}
.dz .cover{width:88px;border-radius:12px;flex:none;aspect-ratio:1;box-shadow:0 0 0 1px var(--line)}
.dz .db{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.dz .db .t-ts{text-wrap:balance}
.dz .db .bar{margin-top:auto}
.dz .tops{display:flex;gap:6px;flex-wrap:wrap}
.wbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin-top:16px}
.wbn{aspect-ratio:1;border-radius:12px;background:var(--surface-1);box-shadow:0 0 0 1px var(--line);display:grid;place-items:center;font:600 15px/1 var(--font-display);position:relative}
.wbn.done::after{content:"";position:absolute;bottom:7px;width:6px;height:6px;border-radius:50%;background:var(--ok)}
.wbn.cur{box-shadow:0 0 0 2px var(--accent)}

/* ── TASK ── */
.thero{border-radius:24px;overflow:hidden;margin-top:4px}
.thero .cover{aspect-ratio:16/9}
.path{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:20px 0 4px;position:relative}
.path::before{content:"";position:absolute;top:15px;left:12.5%;right:12.5%;border-top:1.5px dashed var(--line-strong)}
.pst{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative;min-height:44px}
.pst .pd{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface-1);box-shadow:0 0 0 1.5px var(--line-strong);font:650 13px/1 var(--font-display);color:var(--ink-3)}
.pst.done .pd{background:var(--ink-1);color:var(--bg);box-shadow:none}
.pst.cur .pd{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 4px var(--accent-soft)}
.pst span{font:550 12px/15px var(--font-text);color:var(--ink-2)}
.pst.cur span{color:var(--ink-1)}
.acc-list{display:grid;gap:8px}
details.acc{border-radius:16px;background:var(--surface-1);box-shadow:0 0 0 1px var(--line)}
details.acc summary{list-style:none;display:flex;align-items:center;gap:12px;min-height:56px;padding:0 16px;cursor:pointer;font:600 15px/20px var(--font-text)}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary .ic{margin-left:auto;transition:transform var(--d-small) var(--spring-snappy);color:var(--ink-3)}
details.acc[open] summary .ic{transform:rotate(90deg)}
details.acc .ab{padding:0 16px 16px;color:var(--ink-2)}
details.acc ol,details.acc ul{margin:0;padding-left:20px;display:grid;gap:6px}
.sheetrow{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tool{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:16px;background:var(--surface-1);box-shadow:0 0 0 1px var(--line);text-align:left;min-height:88px}
.tool .ic{color:var(--accent-text)}
.tool b{font:550 14px/18px var(--font-text)}

/* levels map */
.lvmap{position:relative;display:grid;gap:0;padding:8px 0}
.lv{display:flex;align-items:center;gap:14px;min-height:72px;position:relative;text-align:left;width:100%}
.lv .ln{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface-1);box-shadow:0 0 0 1.5px var(--line-strong);font:650 17px/1 var(--font-display);position:relative;z-index:1}
.lv.done .ln{background:var(--ink-1);color:var(--bg);box-shadow:none}
.lv.cur .ln{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 6px var(--accent-soft)}
.lv.lock{color:var(--ink-3)}
.lv::before{content:"";position:absolute;left:26px;top:-10px;bottom:-10px;border-left:1.5px dashed var(--line-strong)}
.lv:first-child::before{top:50%}.lv:last-child::before{bottom:50%}
.stars{display:inline-flex;gap:2px}
.stars svg{width:14px;height:14px}
.star{fill:var(--surface-3)}
.star.on{fill:var(--accent)}

/* ── VARIANT ── */
.vwrap{display:grid;gap:12px}
.vwrap>*{min-width:0}
.stage{position:relative;border-radius:20px;overflow:hidden;background:var(--draw-paper);box-shadow:0 0 0 1px var(--line)}
.stage svg.dr{width:100%;height:auto;max-height:56vh}
.stage .tools{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.stage .tools .chip{background:var(--overlay);box-shadow:var(--shadow-2)}
.stage .stepno{position:absolute;left:12px;top:10px;font:600 12px/16px var(--font-text);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.chapters{display:flex;gap:3px;align-items:flex-end}
.chap{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;padding-top:12px;min-height:44px;justify-content:flex-end}
.chap i{display:block;height:4px;border-radius:2px;background:var(--surface-3);transition:background-color var(--d-small),height var(--d-small) var(--spring-snappy)}
.chap.done i{background:var(--ink-1)}
.chap.cur i{background:var(--accent);height:6px}
.chap span{font:500 10px/12px var(--font-text);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.chap.cur span{color:var(--ink-1);font-weight:650}
.stepcard{padding:16px}
.stepcard h2{margin:4px 0 8px}
.ladder{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.ladder .chip{min-height:36px}
.reveal{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--surface-2);color:var(--ink-2);animation:pop var(--d-small) var(--spring-snappy) both}
.tryself{padding:16px;border-radius:16px;background:var(--accent-soft);color:var(--ink-1);margin-top:12px}
.tryself b{display:block;margin-bottom:4px}
.actbar{position:fixed;z-index:41;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:center;padding:10px var(--gutter-r) calc(10px + var(--sab)) var(--gutter-l);background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 -1px 0 var(--line)}
.actbar .inner{display:flex;gap:8px;align-items:center;max-width:720px;margin:0 auto;width:100%}
.actbar .btn.pri{flex:1}
.askbtn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 14px 0 6px;border-radius:14px;background:var(--surface-2);font:600 14px/18px var(--font-text)}
.askbtn canvas{width:36px;height:36px}

/* drawing */
.dr text{font-family:var(--font-drawing);font-size:12.5px;fill:var(--draw-ink)}
.dr .gr{stroke:var(--draw-grid);stroke-width:.6}
.d-main{stroke:var(--draw-ink);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.d-thin{stroke:var(--draw-thin);stroke-width:.75;fill:none}
.d-axis{stroke:var(--draw-thin);stroke-width:.75;fill:none;stroke-dasharray:12 2.5 2 2.5}
.d-hid{stroke:var(--draw-ink);stroke-width:1.1;fill:none;stroke-dasharray:5 3}
.d-link{stroke:var(--draw-thin);stroke-width:.7;fill:none}
.d-build{stroke:var(--draw-build);stroke-width:2;fill:none;stroke-linecap:round}
.d-build.dash{stroke-dasharray:5 3}
.d-err{stroke:var(--err);stroke-width:2;fill:none}
.d-ghost{stroke:var(--draw-build);stroke-width:1.6;fill:none;stroke-dasharray:3 3;opacity:.9}
.d-pt{fill:var(--draw-ink)}
.d-pt.b{fill:var(--draw-build)}
.d-lbl.b{fill:var(--draw-build)!important}
.dim{opacity:.45}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:drawline var(--d-draw) var(--e-draw) forwards}
@keyframes drawline{to{stroke-dashoffset:0}}
.fadein{opacity:0;animation:fadein var(--d-medium) var(--e-enter) forwards}
@keyframes fadein{to{opacity:1}}
.pulse{transform-box:fill-box;transform-origin:center;animation:ptpulse 1.6s var(--e-standard) 2}
@keyframes ptpulse{0%{transform:scale(1)}30%{transform:scale(1.9)}60%{transform:scale(1)}}
.ring{fill:none;stroke:var(--err);stroke-width:2}
.ringpulse{transform-box:fill-box;transform-origin:center;animation:ringp 1.4s var(--e-standard) infinite}
@keyframes ringp{0%{opacity:1;transform:scale(.6)}100%{opacity:0;transform:scale(1.5)}}

/* skeleton */
.sk{background:var(--surface-2);border-radius:12px;position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--surface-1) 60%,transparent),transparent);transform:translateX(-100%);animation:shim 1.2s infinite}
@keyframes shim{to{transform:translateX(100%)}}

/* ── AGENT / CHAT ── */
.chat{display:flex;flex-direction:column;gap:20px;padding-top:8px}
.ctxchip{max-width:150px;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 12px;border-radius:999px;background:var(--surface-2);font:550 12px/1 var(--font-text);color:var(--ink-2);white-space:nowrap}
.ctxchip .ic{width:14px;height:14px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:16px 0 0}
.empty .orb{width:128px;height:128px}
.empty p{max-width:32ch;color:var(--ink-2);margin:8px 0 20px}
.scen{display:grid;gap:8px;width:100%}
.scen button{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px;border-radius:16px;background:var(--surface-1);box-shadow:0 0 0 1px var(--line);text-align:left;transition:transform var(--d-small) var(--spring-snappy)}
.scen button:active{transform:scale(.98)}
.scen .ic{color:var(--accent-text)}
.scen b{display:block;font:550 15px/20px var(--font-text)}
.scen span{display:block;font:450 13px/18px var(--font-text);color:var(--ink-3)}
.msg{animation:msg-in var(--d-medium) var(--spring-smooth) both}
@keyframes msg-in{from{opacity:0;transform:translateY(10px)}}
.msg.u{align-self:flex-end;max-width:85%;padding:10px 14px;border-radius:20px 20px 6px 20px;background:var(--surface-3);font:400 16px/23px var(--font-text)}
.msg.a{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.glyph{width:28px;height:28px;flex:none}
.msg.a .mb{min-width:0;display:grid;gap:10px;font:400 16px/24px var(--font-text)}
.msg.a .mb p{margin:0}
.msg.a ol{margin:0;padding-left:20px;display:grid;gap:6px}
.thinking{display:flex;align-items:center;gap:8px;color:var(--ink-3);font:450 14px/20px var(--font-text);min-height:28px}
.thinking .dots{display:inline-flex;gap:3px}
.thinking .dots i{width:4px;height:4px;border-radius:50%;background:currentColor;animation:dot 1s infinite}
.thinking .dots i:nth-child(2){animation-delay:.15s}.thinking .dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.25}30%{opacity:1}}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .chip{background:var(--surface-1);box-shadow:0 0 0 1px var(--line-strong);white-space:normal;text-align:left;padding:8px 14px;line-height:18px}
.acts .chip.p{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.mdraw{border-radius:16px;overflow:hidden;background:var(--draw-paper);box-shadow:0 0 0 1px var(--line);position:relative}
.mdraw svg{width:100%;height:auto}
.mdraw .cap{position:absolute;left:10px;top:8px;font:600 11px/14px var(--font-text);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.photo{position:relative;border-radius:16px;overflow:hidden;background:#d9d6cf}
.photo svg{width:100%;height:auto}
.scanline{position:absolute;left:0;right:0;height:2px;background:var(--accent);box-shadow:0 0 16px 2px var(--accent);animation:scan 1.6s var(--e-standard) infinite;top:0}
@keyframes scan{0%{top:2%}50%{top:96%}100%{top:2%}}
.finding{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:12px;border-radius:14px;background:var(--err-soft)}
.finding .n{width:24px;height:24px;border-radius:50%;background:var(--err);color:var(--surface-1);display:grid;place-items:center;font:700 12px/1 var(--font-display)}
.finding b{display:block;color:var(--err);font:600 14px/20px var(--font-text)}
.finding p{margin:2px 0 0;font:400 14px/20px var(--font-text);color:var(--ink-1)}
.qcard{padding:14px;border-radius:16px;background:var(--surface-1);box-shadow:0 0 0 1px var(--line)}
.verdict{display:flex;gap:8px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--ok-soft);color:var(--ink-1)}
.verdict .ic{color:var(--ok)}
.composer{position:fixed;z-index:41;left:0;right:0;bottom:0;padding:8px var(--gutter-r) calc(8px + var(--sab)) var(--gutter-l);background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.composer .omni{max-width:720px;margin:0 auto}
.attach{display:flex;align-items:center;gap:8px;max-width:720px;margin:0 auto 8px}
.attach .th{width:44px;height:44px;border-radius:10px;overflow:hidden;background:#d9d6cf;flex:none}

/* ── TEST ── */
.wv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.opt{position:relative;border-radius:18px;overflow:hidden;background:var(--draw-paper);box-shadow:0 0 0 1.5px var(--line);transition:box-shadow var(--d-small),transform var(--d-small) var(--spring-snappy);text-align:left}
.opt:active{transform:scale(.98)}
.opt svg{width:100%;height:auto}
.opt .ol{position:absolute;left:10px;top:8px;font:650 14px/1 var(--font-display);color:var(--ink-3)}
.opt.sel{box-shadow:0 0 0 2.5px var(--ink-1)}
.opt.right{box-shadow:0 0 0 2.5px var(--ok)}
.opt.wrong{box-shadow:0 0 0 2.5px var(--err)}
.opt .badge{position:absolute;right:8px;top:8px}
.result{margin-top:16px;padding:16px;animation:pop var(--d-medium) var(--spring-bouncy) both}
.bigstars{display:flex;gap:10px;justify-content:center;margin:12px 0}
.bigstars svg{width:44px;height:44px}
.bigstars .star{transform-origin:center;transform-box:fill-box}
.bigstars .star.on{animation:starpop var(--d-page) var(--spring-bouncy) both}
@keyframes starpop{from{transform:scale(0) rotate(-30deg)}}

/* ── PROFILE ── */
.stamp{position:relative;padding:0;overflow:hidden;border-radius:20px;background:var(--surface-1);box-shadow:0 0 0 1.5px var(--ink-1)}
.stamp .g{display:grid;grid-template-columns:1.2fr 1fr;border-top:1.5px solid var(--ink-1)}
.stamp .g>div{padding:8px 12px;border-right:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong);min-width:0}
.stamp .g>div:nth-child(2n){border-right:0}
.stamp .g>div:nth-last-child(-n+2){border-bottom:0}
.stamp .k{font:600 10px/12px var(--font-text);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.stamp .v{font:550 14px/20px var(--font-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stamp .top{padding:16px 16px 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.stamp .status{font:650 34px/36px var(--font-display);letter-spacing:-.02em}
.stamp .acc-line{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.statusline{display:flex;gap:4px;margin-top:10px}
.statusline i{flex:1;height:4px;border-radius:2px;background:var(--surface-3)}
.statusline i.on{background:var(--ink-1)}
.statusline i.part{background:linear-gradient(90deg,var(--accent) 60%,var(--surface-3) 60%)}
.rhythm{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.day{aspect-ratio:1;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font:550 11px/1 var(--font-text);color:var(--ink-3)}
.day.on{background:var(--ink-1);color:var(--bg)}
.day.today{box-shadow:0 0 0 2px var(--accent)}
.skill{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.skill:last-child{border-bottom:0}
.skill .bar{grid-column:1/-1}
.listrow{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.listrow:last-child{border-bottom:0}
.listrow .lb{flex:1;min-width:0}
.listrow .lb b{display:block;font:550 15px/20px var(--font-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.listrow .lb span{display:block;font:450 13px/18px var(--font-text);color:var(--ink-3)}
.pad{padding:4px 16px}
.switch{position:relative;width:51px;height:31px;border-radius:999px;background:var(--surface-3);flex:none;transition:background-color var(--d-small)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform var(--d-small) var(--spring-snappy)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

/* onboarding */
.onb{min-height:calc(100dvh - 40px);display:flex;flex-direction:column;padding-top:16px;padding-bottom:24px}
.onb .dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.onb .dots i{width:6px;height:6px;border-radius:3px;background:var(--surface-3);transition:width var(--d-small) var(--spring-snappy)}
.onb .dots i.on{width:20px;background:var(--ink-1)}
.onb .body{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px}
.onb .choices{display:grid;gap:8px;width:100%;margin-top:8px}
.choice{display:flex;align-items:center;gap:12px;min-height:60px;padding:0 16px;border-radius:16px;background:var(--surface-1);box-shadow:0 0 0 1.5px var(--line);text-align:left;font:550 16px/20px var(--font-text)}
.choice[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.vpad{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:100%}
.vpad button{height:48px;border-radius:12px;background:var(--surface-2);font:600 16px/1 var(--font-display)}
.vpad button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* view transitions: обложка карточки превращается в шапку страницы */
::view-transition-old(root),::view-transition-new(root){animation-duration:var(--d-medium)}
::view-transition-group(cover){animation-duration:var(--d-page);animation-timing-function:var(--spring-smooth)}
::view-transition-old(cover),::view-transition-new(cover){height:100%;object-fit:cover}

/* ── DESKTOP ≥ 1024 ── */
@media (min-width:1024px){
  .app{display:grid;grid-template-columns:248px minmax(0,1fr) auto;min-height:100vh}
  .rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:20px 12px;border-right:1px solid var(--line)}
  .rail .wordmark{padding:8px 12px 20px;flex:none}
  .rail .tab{flex-direction:row;justify-content:flex-start;gap:14px;height:48px;padding:0 14px;border-radius:12px;font:550 15px/20px var(--font-text)}
  .rail .tab:hover{background:var(--surface-2)}
  .rail .tab[aria-current="page"]{background:var(--surface-2)}
  .rail .tab[aria-current="page"]::before{left:0;top:14px;bottom:14px;width:3px;height:auto;border-radius:0 2px 2px 0}
  .rail .tab.agent canvas{width:32px;height:32px;margin:-4px}
  .rail .spacer{flex:1}
  .rail .nowbar{position:static;height:auto;flex-direction:column;align-items:stretch;padding:12px;gap:10px;box-shadow:0 0 0 1px var(--line);left:auto;right:auto}
  .rail .nowbar .nbrow{display:flex;gap:10px;align-items:center}
  .tabbar,.app>.nowbar{display:none!important}
  .view{padding-block:8px 64px;max-width:960px;width:100%}
  .home-grid>*{min-width:0}
  .screen>.topbar .wordmark{visibility:hidden}
  .thero .cover{aspect-ratio:21/9}
  .view.focus{padding-block-end:120px}
  .t-dl{font-size:56px;line-height:60px}
  .t-dm{font-size:40px;line-height:44px}
  .topbar{margin:0 0 4px;padding:0}
  .hero{padding-top:48px}
  .hero .orb{width:200px;height:200px}
  .omni{min-height:64px;border-radius:22px}
  .starters{grid-template-columns:repeat(4,1fr)}
  .home-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:start;margin-top:8px}
  .home-grid .now{margin-top:52px}
  .cont{width:240px}
  .shelf{margin:0;padding:2px 0 8px}
  .shero{margin:0}
  .shero .cover{height:240px;border-radius:24px}
  .shero .st{padding:20px 0 8px}
  .utabs{margin:0;padding:0}
  .dzlist{grid-template-columns:1fr 1fr}
  .dock{display:block;width:380px;border-left:1px solid var(--line);position:sticky;top:0;height:100vh;background:var(--surface-1)}
  .app.nodock .dock{display:none}
  .dock .dh{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--line)}
  .dock .dh canvas{width:40px;height:40px}
  .dock .dbody{padding:16px;display:grid;gap:12px;overflow:auto;height:calc(100vh - 150px);align-content:start}
  .dock .dfoot{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 16px;background:var(--surface-1)}
  .dock .omni{min-height:52px}
  .actbar,.composer{left:248px}
  body.docked .actbar,body.docked .composer{right:380px}
  .vwrap{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start;gap:20px}
  .vwrap .stage{position:sticky;top:72px}
  .vwrap .stage svg.dr{max-height:calc(100vh - 140px)}
  .sheet{bottom:auto;top:50%;left:50%;right:auto;width:480px;border-radius:28px;transform:translate(-50%,-50%);animation-name:dlg-in;padding-bottom:24px}
  .sheet.out{animation-name:dlg-out}
  @keyframes dlg-in{from{opacity:0;transform:translate(-50%,-46%) scale(.97)}}
  @keyframes dlg-out{to{opacity:0;transform:translate(-50%,-48%) scale(.98)}}
  .sheet .grab{display:none}
  .toast{bottom:32px}
  .wv{gap:16px}
}
@media (max-width:370px){
  .t-dm{font-size:26px;line-height:30px}
  .starters{grid-template-columns:1fr}
  .subj .sb{padding:10px}
  .chap span{display:none}
}

'use strict';
/* ═══ Начерт · прототип дизайн-системы «Связь» ═══
   Всё на ванильном JS: роутер по #хэшу, «Наставник» на Canvas 2D, чертёж ДЗ №4 вычисляется (конус ∩ цилиндр). */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const html = (s, ...v) => s.reduce((a, x, i) => a + x + (i < v.length ? v[i] : ''), '');
const ic = (n, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const root = document.documentElement;
const mq = matchMedia('(prefers-reduced-motion: reduce)');
const reduce = () => mq.matches || root.dataset.motion === 'reduce';
const store = { get(k, d) { try { const v = localStorage.getItem('nch.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem('nch.' + k, JSON.stringify(v)); } catch (e) {} } };
const S = { step: 4, mode: 'watch', seen: new Set([0, 1, 2, 3]), ask: '', chat: [], scenario: null, overlay: false, prev: 'home' };
const STEPS = ['Условие', 'Опорные 1, 2', 'Очерк: 3, 4', 'Точка 5', 'Промежуточные', 'Видимость', 'Обводка'];
const desk = () => innerWidth >= 1024;
function vib(ms = 8) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

/* ───────── ТЕМА ───────── */
(function initTheme() {
  const t = store.get('theme', null); if (t) root.dataset.theme = t;
  const m = store.get('motion', null); if (m) root.dataset.motion = m;
})();
function isDark() { return root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
function toggleTheme() {
  const next = isDark() ? 'light' : 'dark';
  const apply = () => { root.dataset.theme = next; store.set('theme', next); Orb.recolor(); $$('[data-theme-ic]').forEach(b => b.innerHTML = ic(next === 'dark' ? 'sun' : 'moon')); };
  if (document.startViewTransition && !reduce()) document.startViewTransition(apply); else apply();
  toast(next === 'dark' ? 'Тёмная тема' : 'Светлая тема', next === 'dark' ? 'moon' : 'sun');
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => Orb.recolor());

/* ───────── НАСТАВНИК: «Огибающая» ─────────
   Окружность, построенная касательными. Вращается в пространстве → в проекции эллипс (сама суть предмета).
   Касательные за плоскостью рисуются штрихом, как невидимые линии на чертеже. */
const Orb = (() => {
  const all = new Set(); let raf = 0, last = 0, col = {};
  const hex = h => { h = h.trim(); if (h[0] !== '#') return [128, 128, 128]; const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  function recolor() { const cs = getComputedStyle(root); for (const k of ['ink-1', 'accent', 'err', 'ok', 'ink-3']) col[k] = hex(cs.getPropertyValue('--' + k)); all.forEach(o => o.dirty = true); }
  const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  const TARGET = {
    idle:    { tilt: .5, spin: .2, len: .95, acc: .15, gap: 0, dot: 0, back: .3, think: 0 },
    listen:  { tilt: .95, spin: .5, len: .8, acc: .6, gap: 0, dot: 0, back: .38, think: 0 },
    think:   { tilt: .85, spin: 2.4, len: 1.25, acc: 1, gap: 0, dot: 0, back: .45, think: 1 },
    speak:   { tilt: .35, spin: .8, len: 1.0, acc: .75, gap: 0, dot: 0, back: .34, think: 0 },
    error:   { tilt: .3, spin: .06, len: .9, acc: 0, gap: 1, dot: 0, back: .22, think: 0, err: 1 },
    success: { tilt: .04, spin: .35, len: .22, acc: 1, gap: 0, dot: 1, back: .3, think: 0 },
  };
  class O {
    constructor(cv, opt = {}) {
      this.cv = cv; this.ctx = cv.getContext('2d'); this.n = opt.n || 24; this.lw = opt.lw || 1.5; this.k = opt.k || .28;
      this.state = 'idle'; this.p = { ...TARGET.idle, err: 0 }; this.phase = Math.random() * 6; this.pulse = 0; this.sq = 0; this.sqv = 0; this.t0 = performance.now();
      this.shake = 0; this.dirty = true; this.size(); all.add(this);
      cv.addEventListener('pointerdown', () => this.tap());
      if (!col['ink-1']) recolor();
      loop();
    }
    size() { const r = this.cv.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2); this.w = r.width || 160; this.h = r.height || 160; this.cv.width = this.w * d; this.cv.height = this.h * d; this.ctx.setTransform(d, 0, 0, d, 0, 0); this.dirty = true; }
    set(s) {
      if (this.state === s) return; this.state = s; this.dirty = true;
      clearTimeout(this.back);
      if (s === 'error') { this.shake = 1; this.back = setTimeout(() => this.set('idle'), 1400); }
      if (s === 'success') { this.sqv += 2.2; this.back = setTimeout(() => this.set('idle'), 1700); }
      loop();
    }
    kick(a = .35) { this.pulse = Math.min(1, this.pulse + a); this.dirty = true; loop(); }
    tap() { this.sqv -= 3.2; this.phase += .4; this.dirty = true; vib(6); loop(); }
    step(dt, now) {
      const T = { err: 0, ...TARGET[this.state] }, p = this.p, k = 1 - Math.exp(-dt / .28);
      for (const key in T) p[key] += (T[key] - p[key]) * k;
      // пружина «сжатия» при касании: жёсткость 520, затухание 26
      const a = -520 * this.sq - 26 * this.sqv; this.sqv += a * dt; this.sq += this.sqv * dt;
      this.pulse *= Math.exp(-dt / .15); this.shake *= Math.exp(-dt / .25);
      this.phase += p.spin * dt;
    }
    draw(now) {
      const c = this.ctx, w = this.w, h = this.h, p = this.p, t = (now - this.t0) / 1000;
      c.clearRect(0, 0, w, h);
      const rm = reduce();
      const breath = rm ? 0 : .028 * Math.sin(t * 2 * Math.PI / 4.2);
      let R = Math.min(w, h) * this.k * (1 + breath + this.pulse * .07) * (1 + this.sq * .06);
      let tilt = p.tilt + (rm ? 0 : p.think * .55 * Math.sin(t * 2 * Math.PI / 1.4)) + (rm ? 0 : .06 * Math.sin(t / 3.1));
      const yaw = rm ? .25 : .25 + .2 * Math.sin(t / 5.3);
      const cx = w / 2 + (rm ? 0 : this.shake * 6 * Math.sin(t * 2 * Math.PI * 7)), cy = h / 2;
      const ca = Math.cos(tilt), sa = Math.sin(tilt), cb = Math.cos(yaw), sb = Math.sin(yaw);
      const proj = (x, y) => { const y1 = y * ca, z1 = y * sa; return [x * cb + z1 * sb, y1, -x * sb + z1 * cb]; };
      const ink = col['ink-1'], acc = p.err > .5 ? col.err : col.accent, base = mix(ink, col.err, p.err);
      const L = R * (p.len + this.pulse * .25);
      for (let i = 0; i < this.n; i++) {
        const a = i / this.n * Math.PI * 2 + this.phase;
        const px = R * Math.cos(a), py = R * Math.sin(a), dx = -Math.sin(a), dy = Math.cos(a);
        const P = proj(px, py), A = proj(px - dx * L, py - dy * L), B = proj(px + dx * L, py + dy * L);
        const front = P[2] <= 0;
        let alpha = front ? .92 : p.back;
        // разрыв при ошибке: сектор сверху «распадается»
        const g = Math.cos(a - this.phase * 0 + Math.PI / 2); const gap = p.gap * Math.max(0, (g - .55) / .45);
        alpha *= 1 - gap;

function bindOmni(f) {
  if (!f) return; const inp = $('input', f), where = f.dataset.omni;
  inp.addEventListener('input', () => {
    f.classList.toggle('has', !!inp.value.trim());
    if (heroOrb) { heroOrb.set(inp.value ? 'listen' : 'idle'); heroOrb.kick(.4); }
    if (where === 'home') dropdown(inp.value); if (where === 'search') showResults(inp.value);
  });
  inp.addEventListener('focus', () => { heroOrb && heroOrb.set('listen'); if (where === 'home' && inp.value) dropdown(inp.value); });
  inp.addEventListener('blur', () => setTimeout(() => { heroOrb && !inp.value && heroOrb.set('idle'); const d = $('#drop'); if (d && !d.contains(document.activeElement)) d.hidden = true; }, 150));
  inp.addEventListener('keydown', e => { if (e.key === 'Escape') { inp.value = ''; inp.dispatchEvent(new Event('input')); inp.blur(); } });
  f.addEventListener('submit', e => {
    e.preventDefault(); const q = inp.value.trim(); if (!q) return;
    const hit = match(q)[0];
    if (where !== 'agent' && hit && /^\d+$|вариант|^дз/i.test(q) && hit.go) { inp.value = ''; go(hit.go); return; }

function match(q) {
  q = q.toLowerCase().trim(); if (!q) return [];
  const words = q.split(/\s+/);

    .filter(x => x.sc > 0).sort((a, b) => b.sc - a.sc).slice(0, 5);
}

      <div class="bigstars">${[0, 1, 2].map(i => `<svg viewBox="0 0 24 24"><path class="star ${right || i < 1 ? 'on' : ''}" style="animation-delay:${i * 120}ms" d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg>`).join('')}</div>
      <button class="btn pri l wide" data-act="testdone">${right ? 'Дальше' : 'Разобрать и повторить'}</button><p class="t-c" style="text-align:center;margin-top:10px">${right ? 'Повторим через 3 дня' : 'Вернёмся к этому завтра'}</p></div>`;
    $('#tres').scrollIntoView({ block: 'nearest', behavior: reduce() ? 'auto' : 'smooth' });
  },
  testdone() { toast('Уровень 3 пройден. Повторение — в пятницу', 'check'); go('task', { back: true }); },
  onbnext() { ONB = Math.min(2, ONB + 1); render(); },
  onbdone() { ONB = 0; store.set('hello', 1); go('home'); toast('Готово. Вариант 13 запомнили', 'check'); },
  choice(b) { b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'); },
  vnum(b) { $$('.vpad button').forEach(x => x.setAttribute('aria-pressed', x === b)); },
};

/* ── шторка и тост ── */
let lastFocus = null;
function sheet(inner, label) {
  lastFocus = document.activeElement;
  $('#layer').innerHTML = `<div class="scrim" data-act="closesheet"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${label}" tabindex="-1"><div class="grab" aria-hidden="true"></div>${inner}</div>`;
  const sh = $('.sheet'); sh.focus();
  let y0 = null, dy = 0;
  sh.addEventListener('pointerdown', e => { if (sh.scrollTop > 0) return; y0 = e.clientY; dy = 0; sh.style.transition = 'none'; });
  sh.addEventListener('pointermove', e => { if (y0 == null) return; dy = Math.max(0, e.clientY - y0); if (!desk()) sh.style.transform = `translateY(${dy}px)`; });
  const end = () => { if (y0 == null) return; y0 = null; sh.style.transition = ''; if (dy > 90) closeSheet(); else sh.style.transform = ''; };
  sh.addEventListener('pointerup', end); sh.addEventListener('pointercancel', end);
}
function closeSheet() { const s = $('.sheet'), c = $('.scrim'); if (!s) return; s.style.transform = ''; s.classList.add('out'); c.classList.add('out'); setTimeout(() => { $('#layer').innerHTML = ''; lastFocus && lastFocus.focus && lastFocus.focus(); }, 200); }
addEventListener('keydown', e => { if (e.key === 'Escape' && $('.sheet')) closeSheet(); });
let tt;
function toast(t, i = 'check') {
  const old = $('.toast'); old && old.remove(); clearTimeout(tt);
  document.body.insertAdjacentHTML('beforeend', `<div class="toast" role="status">${ic(i)}<span>${t}</span></div>`);
  tt = setTimeout(() => { const x = $('.toast'); if (x) { x.classList.add('out'); setTimeout(() => x.remove(), 200); } }, 2600);
}

/* ── пристыкованный наставник (компьютер) ── */
function renderDock() {
  const r = route();
  const ctx = r === 'variant' ? `ДЗ №4 · в13 · шаг ${S.step + 1}` : r === 'task' ? 'ДЗ №4 · вариант 13' : r === 'test' ? 'Уровень 3 · видимость' : 'Начертательная геометрия';
  $('#dock').innerHTML = `<div class="dh"><canvas id="dockOrb" aria-hidden="true"></canvas><div style="flex:1;min-width:0"><b class="t-ts">Наставник</b><p class="t-c">Видит: ${ctx}</p></div></div>
  <div class="dbody"><p class="t-b ink2">${r === 'variant' ? 'Спроси про этот шаг — объясню прямо на чертеже слева.' : 'Спроси что угодно по этому разделу.'}</p>
  ${(r === 'variant' ? [['Почему здесь горизонтальная плоскость?', 'stuck'], ['Покажи, где точка ' + (S.step + 2), 'stuck'], ['Проверь мой лист по фото', 'photo']] : [['С чего начать ДЗ №4', 'start'], ['Проверь мой лист по фото', 'photo'], ['Подготовь к защите', 'defense']]).map(x => `<button class="starter" data-act="scen" data-s="${x[1]}"><b>${x[0]}</b></button>`).join('')}</div>
  <div class="dfoot"><form class="omni" data-omni="dock"><label class="vh" for="q-dock">Вопрос наставнику</label><input id="q-dock" placeholder="Спроси про шаг"><button type="submit" class="ibtn acc send" aria-label="Отправить">${ic('up')}</button></form></div>`;
  const o = Orb.make($('#dockOrb'), { n: 12, lw: 1.2, k: .27 });
  const f = $('#dock form'); f.addEventListener('submit', e => { e.preventDefault(); const q = $('input', f).value.trim(); if (!q) return; S.chat = []; S.ask = q; go('agent'); });
  $('input', f).addEventListener('input', e => { f.classList.toggle('has', !!e.target.value); o.set(e.target.value ? 'listen' : 'idle'); o.kick(.4); });
}
addEventListener('resize', () => { clearTimeout(window.__rz); window.__rz = setTimeout(() => { renderChrome(); segInd(); }, 150); });

/* старт */
render();
</script>
