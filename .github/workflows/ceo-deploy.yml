name: Штаб CEO — развёртывание облачной функции
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ceo-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Секреты на месте?
        env:
          YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
          GH_CEO_TOKEN: ${{ secrets.GH_CEO_TOKEN }}
          CEO_CODE: ${{ secrets.CEO_CODE }}
        run: |
          test -n "$YC_SA_KEY" || { echo "::error::Нет секрета YC_SA_KEY"; exit 1; }
          test -n "$GH_CEO_TOKEN" || { echo "::error::Нет секрета GH_CEO_TOKEN"; exit 1; }
          test -n "$CEO_CODE" || { echo "::error::Нет секрета CEO_CODE"; exit 1; }
      - name: Программа yc
        env:
          YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
          YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID || 'b1gm1vb5prlop8thuobf' }}
        run: |
          for i in 1 2 3; do timeout 120 bash -c 'curl -sSL --max-time 100 https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yc" -n >/dev/null' && break; echo "yc не скачался, попытка $((i+1))"; sleep 5; done
          test -x "$HOME/yc/bin/yc" || { echo "::error::Не удалось скачать yc — перезапустите"; exit 1; }
          echo "$HOME/yc/bin" >> "$GITHUB_PATH"
          printf '%s' "$YC_SA_KEY" > "$RUNNER_TEMP/yc-key.json"
          "$HOME/yc/bin/yc" config profile create ci >/dev/null
          "$HOME/yc/bin/yc" config set service-account-key "$RUNNER_TEMP/yc-key.json"
          "$HOME/yc/bin/yc" config set folder-id "$YC_FOLDER_ID"
          "$HOME/yc/bin/yc" config set endpoint api.cloud.yandex.net:443
      - name: Функция nachert-ceo
        env:
          GH_CEO_TOKEN: ${{ secrets.GH_CEO_TOKEN }}
          CEO_CODE: ${{ secrets.CEO_CODE }}
          REPO: ${{ github.repository }}
        run: |
          echo "::add-mask::$GH_CEO_TOKEN"
          HASH=$(node -e "console.log(require('./server/ceo/index.js').sha(process.env.CEO_CODE))")
          rm -rf pkgceo && mkdir pkgceo && cp server/ceo/index.js pkgceo/index.js
          (cd pkgceo && zip -qr ../ceo.zip .)
          yc serverless function get --name nachert-ceo >/dev/null 2>&1 || yc serverless function create --name nachert-ceo >/dev/null
          yc serverless function allow-unauthenticated-invoke --name nachert-ceo >/dev/null
          yc serverless function version create --function-name nachert-ceo --runtime nodejs22 --entrypoint index.handler --memory 128m --execution-timeout 30s --concurrency 8 \
            --source-path ceo.zip --environment "CEO_CODE_SHA256=$HASH,GH_TOKEN=$GH_CEO_TOKEN,GH_REPO=$REPO" >/dev/null
          ID=$(yc serverless function get --name nachert-ceo --format json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).id))")
          echo "CEO_URL=https://functions.yandexcloud.net/$ID" >> "$GITHUB_ENV"
      - name: Проверка — функция жива, код проверяется
        env:
          CEO_CODE: ${{ secrets.CEO_CODE }}
        run: |
          ENC=$(node -e "console.log(encodeURIComponent(process.env.CEO_CODE))")
          a=$(curl -sS -m 40 -o /tmp/b.txt -w "%{http_code}" -H "Origin: https://nachert1830.ru" "$CEO_URL"); echo "без кода: $a"; [ "$a" = 200 ] || exit 1
          b=$(curl -sS -m 40 -o /tmp/b.txt -w "%{http_code}" -H "Origin: https://nachert1830.ru" -H "x-ceo-code: nope" "$CEO_URL"); echo "неверный код: $b"; [ "$b" = 401 ] || exit 1
          c=$(curl -sS -m 40 -o /tmp/b.txt -w "%{http_code}" -H "Origin: https://nachert1830.ru" -H "x-ceo-code: $ENC" "$CEO_URL"); echo "верный код: $c"; [ "$c" = 200 ] || { head -c 300 /tmp/b.txt; exit 1; }
      - name: Адрес — в ceo/config.js
        run: |
          mkdir -p ceo
          printf '/* Адрес функции штаба CEO. Файл пишет .github/workflows/ceo-deploy.yml. */\nwindow.CEO_API=window.CEO_API||"%s";\n' "$CEO_URL" > ceo/config.js
          git diff --quiet -- ceo/config.js && git ls-files --error-unmatch ceo/config.js >/dev/null 2>&1 && { echo "адрес не изменился"; exit 0; }
          git config user.name "ceo-deploy"; git config user.email "ceo-deploy@users.noreply.github.com"
          git add ceo/config.js; git commit -m "Штаб CEO: адрес облачной функции"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Убрать ключ
        if: always()
        run: rm -f "$RUNNER_TEMP/yc-key.json" ceo.zip
