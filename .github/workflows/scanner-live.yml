name: Сканер — живая проверка на сайте
# Кабинет на nachert1830.ru → «Проверка» → ДЗ № 3 → фото синтетического листа → ответ (lab/dz/test-live.js, Chromium).
# Вход — одноразовая ссылка владельца (server/tools/login.js через yc). Ничего не развёртывает: только открывает сайт как студент.
# Снимки экрана и журнал — в артефакте scanner-live. Пуш в рабочую ветку проверяет сайт как есть (до слияния — прежняя версия).
on:
  workflow_dispatch:
    inputs:
      far:
        description: 'отметить «лист мой — можно зарубежной модели» (лист синтетический): 1 / 0'
        required: false
        default: '1'
      n:
        description: 'вариант синтетического листа'
        required: false
        default: '21'
  push:
    branches: [main, claude/scanner-release]
    paths: ['lab/cam.html', 'lab/scanner.js', 'lab/dz/**', 'lk/app.js', 'server/lib/eyes.js', '.github/workflows/scanner-live.yml']
permissions:
  contents: read
concurrency:
  group: scanner-live
  cancel-in-progress: true
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright и Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw" && npm init -y >/dev/null && npm i playwright@1.63.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Сайт обновился (GitHub Pages)
        if: github.ref == 'refs/heads/main'
        run: |
          for i in $(seq 1 40); do curl -fsS "https://nachert1830.ru/lab/cam.html?t=$(date +%s)" | grep -q 'id="aiRow"' && { echo "страница сканера — свежая"; exit 0; }; sleep 15; done
          echo "::warning::на сайте ещё старая страница сканера — проверяю как есть"
      - name: Ссылка входа владельца (yc)
        env:
          YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
          YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID || 'b1gm1vb5prlop8thuobf' }}
        run: |
          test -n "$YC_SA_KEY" || { echo "::error::нет секрета YC_SA_KEY"; exit 1; }
          for i in 1 2 3; do timeout 120 bash -c 'curl -sSL --max-time 100 https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yc" -n >/dev/null' && break; sleep 5; done
          printf '%s' "$YC_SA_KEY" > "$RUNNER_TEMP/yc-key.json"
          "$HOME/yc/bin/yc" config profile create ci >/dev/null
          "$HOME/yc/bin/yc" config set service-account-key "$RUNNER_TEMP/yc-key.json"
          "$HOME/yc/bin/yc" config set folder-id "$YC_FOLDER_ID"
          "$HOME/yc/bin/yc" config set endpoint api.cloud.yandex.net:443
          export PATH="$HOME/yc/bin:$PATH"
          OUT=$(yc serverless function invoke --name nachert-club-api --data '{"club":"owner-login"}' 2>&1) || true
          L=$(printf '%s' "$OUT" | grep -oE 'https://[^ "\\]+/#/tg/[A-Za-z0-9_-]{20,}' | head -1)
          test -n "$L" || { echo "::error::ссылку входа получить не удалось — ответ функции кабинета:"; printf '%s\n' "$OUT" | sed -E 's#/tg/[A-Za-z0-9_-]+#/tg/…#g' | head -20; rm -f "$RUNNER_TEMP/yc-key.json"; exit 1; }
          T=$(yc iam create-token); echo "::add-mask::$T"; echo "EYES_KEY=$T" >> "$GITHUB_ENV"; echo "EYES_FOLDER=$YC_FOLDER_ID" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/yc-key.json"
          echo "::add-mask::$L"; echo "NCH_LOGIN=$L" >> "$GITHUB_ENV"
      - name: Новая версия кабинета (эмуляция server/dev.js) с настоящей моделью — Qwen в Yandex
        env:
          EYES_MODEL: 'gpt://{folder}/qwen3.6-35b-a3b/latest'
          EYES_OPTS: '{"reasoning_effort":"none"}'
        run: node lab/dz/test-path.js --n=${{ github.event.inputs.n || '21' }} --eyes=env --only=phone --b64=1 --out=live-shots/new || true
      - name: Путь студента на сайте
        run: node lab/dz/test-live.js --n=${{ github.event.inputs.n || '21' }} --far=${{ github.event.inputs.far || '1' }} --out=live-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scanner-live
          path: live-shots/**/*.png
          if-no-files-found: ignore
