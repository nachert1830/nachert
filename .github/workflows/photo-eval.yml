name: Настоящее фото → большая модель (зашифрованная передача)
# Фото студентов в публичный репозиторий не попадают. Прогон создаёт одноразовую пару RSA-ключей и кладёт в ветку только
# открытый ключ (lab/private-tmp/pub.pem); владелец шифрует им архив фото (photos.enc + photos.key.enc) и пушит; прогон
# ждёт до 15 мин, расшифровывает закрытым ключом (он есть только в памяти раннера) и отдаёт фото модели (lab/dz/photo-eval.js).
# В лог — только текст ответа модели; фото и ключ в артефакты не уходят.
on:
  push:
    branches: [claude/brave-maxwell-jel4y0]
    paths: ['lab/dz/photo-eval.js', '.github/workflows/photo-eval.yml']
permissions:
  contents: write
concurrency:
  group: photo-eval
  cancel-in-progress: true
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Одноразовый ключ → в ветку открытая часть; ждать зашифрованные фото
        run: |
          set -e
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/k.pem" 2>/dev/null
          mkdir -p lab/private-tmp
          openssl pkey -in "$RUNNER_TEMP/k.pem" -pubout -out lab/private-tmp/pub.pem
          PUBSHA=$(sha256sum lab/private-tmp/pub.pem | cut -c1-64)
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f lab/private-tmp/pub.pem
          git commit -q -m "photo-eval: открытый ключ прогона $GITHUB_RUN_ID"
          git push -q origin "HEAD:$GITHUB_REF_NAME"
          echo "открытый ключ в ветке, sha256 $PUBSHA; жду фото…"
          for i in $(seq 1 90); do
            sleep 10
            git fetch -q origin "$GITHUB_REF_NAME"
            if [ "$(git show FETCH_HEAD:lab/private-tmp/photos.pub.sha 2>/dev/null)" = "$PUBSHA" ]; then
              git show FETCH_HEAD:lab/private-tmp/photos.key.enc > "$RUNNER_TEMP/k.enc"
              openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/k.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$RUNNER_TEMP/k.enc" -out "$RUNNER_TEMP/aes.key"
              mkdir -p "$RUNNER_TEMP/photos"
              git show FETCH_HEAD:lab/private-tmp/photos.enc | openssl enc -d -aes-256-cbc -pbkdf2 -pass "file:$RUNNER_TEMP/aes.key" | tar -x -C "$RUNNER_TEMP/photos"
              rm -f "$RUNNER_TEMP/k.pem" "$RUNNER_TEMP/aes.key" "$RUNNER_TEMP/k.enc"
              echo "фото получены: $(ls "$RUNNER_TEMP/photos" | wc -l)"
              exit 0
            fi
          done
          echo "::error::фото не пришли за 15 минут"; exit 1
      - name: Модель
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node lab/dz/photo-eval.js "$RUNNER_TEMP/photos" --models=anthropic/claude-sonnet-5.5 --limit=0.05
      - name: Убрать фото с раннера
        if: always()
        run: rm -rf "$RUNNER_TEMP/photos"
