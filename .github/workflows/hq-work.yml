name: Цех — исполнители Штаба
# Задача кода из Штаба (lk/hq/): Issue с меткой «цех» и «исп:<модель>» (server/lib/hq). Прежние пути — метки «в работу» (страница /ceo/)
# и «ai-task» — идут сюда же с исполнителем по умолчанию.
# Порядок: исполнитель правит код в ветке hq/issue-N → быстрые тесты → красные — следующая по силе модель (не больше 3 попыток)
# → зелёные — PR → Ревизор сверяет дифф с ТЗ → метка «автовыкатка» и полный прогон тестов зелёный — слияние в main.
# В main без зелёных тестов код не попадает никогда. Отчёт и стоимость — комментарием в Issue (<!-- hq:{…} --> читает Штаб).
on:
  issues:
    types: [labeled]
  # автооткат: check.yml (полная проверка main красная сразу после выкатки Цеха) запускает откат напрямую —
  # метки, поставленные встроенным токеном Actions, другие workflow не запускают
  workflow_dispatch:
    inputs:
      issue:
        description: 'Номер Issue задачи Цеха, чью выкатку откатить'
        required: true
      why:
        description: 'Причина'
        required: false
permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
# очередь — своя у каждой задачи: общая группа держит один ожидающий запуск и молча отменяет остальные
concurrency:
  group: hq-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  answer:
    # Вопрос про код из Штаба: метка «вопрос» → исполнитель только читает код → ответ комментарием (<!-- hq-answer -->) → метка «ответ»
    if: github.event.label.name == 'вопрос'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      N: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
      PROXYAPI_KEY: ${{ secrets.PROXYAPI_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false   # токен не лежит в .git/config: исполнитель (READ, RUN) его не увидит
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Кэш браузера
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            node_modules
          key: pw-1.47.2-acorn8-${{ runner.os }}
      - name: Ответ
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          set +e
          printf '%s\n\n%s\n' "$TITLE" "$BODY" > /tmp/hq-task.md; echo '{"rub":0,"calls":0,"models":{}}' > /tmp/hq-cost.json
          M=$(echo "$LABELS" | tr ',' '\n' | sed -n 's/^исп://p' | head -1)
          { [ -d node_modules/playwright ] || npm install --no-save --no-package-lock playwright@1.47.2 acorn@8; npx playwright install --with-deps chromium; } >/dev/null 2>&1
          if node tools/hq-agent.js --ask --model "${M:-sonnet}" --task /tmp/hq-task.md; then
            RUB=$(node -e "console.log(require('/tmp/hq-cost.json').rub)")
            { cat /tmp/hq-answer.md; echo; echo "_Ответил: ${M:-sonnet}, ~$RUB ₽._ <!-- hq-answer --> <!-- hq:{\"rub\":$RUB,\"model\":\"${M:-sonnet}\"} -->"; } > /tmp/c.md
            gh issue comment "$N" --body-file /tmp/c.md; gh label create "ответ" >/dev/null 2>&1; gh issue edit "$N" --add-label "ответ"; gh issue close "$N"
          else
            RUB=$(node -e "console.log(require('/tmp/hq-cost.json').rub)" 2>/dev/null || echo 0)
            gh issue comment "$N" --body "Не нашёл ответ за 20 шагов. <!-- hq:{\"rub\":$RUB} -->"; gh label create "провал" >/dev/null 2>&1; gh issue edit "$N" --add-label "провал"
          fi

  merge:
    # Решение владельца по задаче на проверке (Штаб → предпросмотр → «✅ Влить» / «✖ Отклонить»): метка «влить» → проверка PR зелёная →
    # слияние в main и полная проверка; метка «отклонить» → PR закрыт, на сайт ничего не попало
    if: github.event.label.name == 'влить' || github.event.label.name == 'отклонить'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      N: ${{ github.event.issue.number }}
      L: ${{ github.event.label.name }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GH_HQ_TOKEN || secrets.GH_CEO_TOKEN || github.token }}
    steps:
      - name: Влить или отклонить
        run: |
          set +e
          PR=$(gh issue view "$N" --json comments -q '.comments[].body' | grep -o '"pr":"[^"]*"' | tail -1 | cut -d'"' -f4)
          if [ -z "$PR" ]; then gh issue comment "$N" --body "⚠️ Не нашёл PR этой задачи. <!-- hq:{\"rub\":0} -->"; gh issue edit "$N" --remove-label "$L"; exit 1; fi
          if [ "$L" = "отклонить" ]; then
            gh pr close "$PR" --delete-branch >/dev/null 2>&1
            gh issue comment "$N" --body "✖ **Отклонено** владельцем: PR закрыт, на сайт ничего не попало. <!-- hq:{\"rub\":0} -->"
            gh label create "отклонено" >/dev/null 2>&1; gh issue edit "$N" --add-label "отклонено" --remove-label "отклонить" --remove-label "на-проверку"; exit 0
          fi
          # все проверки PR — зелёные (пропущенные и нейтральные — можно); идёт или красная — не вливаем
          BAD=$(gh pr view "$PR" --json statusCheckRollup -q '[.statusCheckRollup[] | (.conclusion // .state // "") | select(. != "SUCCESS" and . != "SKIPPED" and . != "NEUTRAL")] | length')
          ALL=$(gh pr view "$PR" --json statusCheckRollup -q '.statusCheckRollup | length')
          if [ "$ALL" = 0 ] || [ "$BAD" != 0 ]; then
            gh issue comment "$N" --body "⚠️ Не вливаю: проверка PR ещё идёт или красная ($BAD из $ALL не зелёные). Нажми «Влить» позже. PR: $PR <!-- hq:{\"rub\":0} -->"
            gh issue edit "$N" --remove-label "влить"; exit 0
          fi
          if gh pr merge "$PR" --squash --delete-branch; then
            gh workflow run check.yml --ref main || true
            gh issue comment "$N" --body "✅ **Выкачено на сайт** по твоему «влить». PR: $PR <!-- hq:{\"rub\":0,\"pr\":\"$PR\"} -->"
            gh label create "готово" >/dev/null 2>&1; gh issue edit "$N" --add-label "готово" --remove-label "влить" --remove-label "на-проверку"; gh issue close "$N"
          else
            gh issue comment "$N" --body "⚠️ Влить не вышло (конфликт с main?). Перезапусти задачу — исполнитель начнёт со свежего main. PR: $PR <!-- hq:{\"rub\":0} -->"
            gh issue edit "$N" --remove-label "влить"
          fi

  plan:
    # План эпика из Штаба: метка «эпик» → Разведчик (Haiku) собирает пакет кода → Главный инженер (метка исп:, по умолчанию Opus) пишет
    # план JSON → проверка validatePlan (server/lib/hq/epic.js), один повтор → комментарий <!-- hq-plan -->…<!-- /hq-plan --> (Штаб забирает)
    if: github.event.label.name == 'эпик'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      N: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
      PROXYAPI_KEY: ${{ secrets.PROXYAPI_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: План
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          set +e
          test -n "$PROXYAPI_KEY" || { echo "::error::Нет секрета PROXYAPI_KEY"; exit 1; }
          printf '%s\n\n%s\n' "$TITLE" "$BODY" > /tmp/hq-task.md; echo '{"rub":0,"calls":0,"models":{}}' > /tmp/hq-cost.json
          M=$(echo "$LABELS" | tr ',' '\n' | sed -n 's/^исп://p' | head -1); M=${M:-opus}
          if node tools/hq-agent.js --plan --model "$M" --task /tmp/hq-task.md; then
            RUB=$(node -e "console.log(require('/tmp/hq-cost.json').rub)")
            { echo "🧭 План эпика готов ($M, ~$RUB ₽). Утверждает владелец в Штабе."; echo; echo '<!-- hq-plan -->'; echo '```json'; cat /tmp/hq-plan.json; echo; echo '```'; echo '<!-- /hq-plan -->';
              echo "<!-- hq:{\"rub\":$RUB,\"model\":\"$M\"} -->"; } > /tmp/c.md
          else
            RUB=$(node -e "console.log(require('/tmp/hq-cost.json').rub)" 2>/dev/null || echo 0)
            { echo "⚠️ План не прошёл проверку дважды:"; sed 's/^/- /' /tmp/hq-plan-errors.txt 2>/dev/null || echo "- исполнитель упал, смотри лог"; echo;
              echo "<!-- hq-plan-fail --> <!-- hq:{\"rub\":$RUB,\"model\":\"$M\"} -->"; } > /tmp/c.md
          fi
          gh issue comment "$N" --body-file /tmp/c.md
          gh issue edit "$N" --remove-label "эпик" >/dev/null 2>&1 || true   # следующий переплан снова поставит метку и запустит план

  session:
    # Сеанс владельца с исполнителем (Штаб → вкладка «Сеанс»): метка «сеанс» → tools/hq-agent.js --session ждёт реплик «💬 Владелец: …»
    # в Issue, отвечает комментариями <!-- hq-say -->, делает правки, PR (ветка hq/session-N) и «влей» по слову владельца.
    # 20 минут тишины — итог и выход. Очередь — своя у каждого Issue (concurrency выше).
    if: github.event.label.name == 'сеанс'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    env:
      HQ_SANDBOX: '1'   # RUN и проверки исполнителя — в песочнице (tools/hq-run.js)
      HQ_ISSUE: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
      # PR и слияние — токеном владельца (встроенному токену Actions создавать PR запрещено); в окружение RUN он не попадает
      HQ_PR_TOKEN: ${{ secrets.GH_HQ_TOKEN || secrets.GH_CEO_TOKEN || github.token }}
      PROXYAPI_KEY: ${{ secrets.PROXYAPI_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false   # токен не лежит в .git/config: исполнитель (READ, RUN) его не увидит
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Кэш браузера
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            node_modules
          key: pw-1.47.2-acorn8-${{ runner.os }}
      - name: Сеанс
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          test -n "$PROXYAPI_KEY" || { echo "::error::Нет секрета PROXYAPI_KEY"; exit 1; }
          printf '# %s\n\n%s\n' "$TITLE" "$BODY" > /tmp/hq-task.md; echo '{"rub":0,"calls":0,"models":{}}' > /tmp/hq-cost.json
          M=$(echo "$LABELS" | tr ',' '\n' | sed -n 's/^исп://p' | head -1)
          { [ -d node_modules/playwright ] || npm install --no-save --no-package-lock playwright@1.47.2 acorn@8; npx playwright install --with-deps chromium; } >/dev/null 2>&1
          node tools/hq-agent.js --session --model "${M:-opus}" --task /tmp/hq-task.md || {
            gh issue comment "$HQ_ISSUE" --body "⚠️ Сеанс оборвался — смотри лог задания. Начни новый сеанс в Штабе. <!-- hq-say --> <!-- hq-session-end --> <!-- hq:{\"rub\":0} -->"; exit 1; }
          gh issue close "$HQ_ISSUE" >/dev/null 2>&1 || true

  rollback:
    # Откат выкатки из Штаба: метка «откат» → revert слитого PR → быстрые тесты → main → метка «откачено»
    if: github.event.label.name == 'откат' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      N: ${{ github.event.issue.number || inputs.issue }}
      WHY: ${{ inputs.why }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Кэш браузера
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            node_modules
          key: pw-1.47.2-acorn8-${{ runner.os }}
      - name: Откатить
        run: |
          set +e
          git config user.name "hq-bot"; git config user.email "hq-bot@users.noreply.github.com"
          if gh issue view "$N" --json labels -q '.labels[].name' | grep -qx "откачено"; then echo "уже откачено"; exit 0; fi
          PR=$(gh issue view "$N" --json comments -q '.comments[].body' | grep -o '"pr":"[^"]*"' | tail -1 | cut -d'"' -f4)
          SHA=$([ -n "$PR" ] && gh pr view "$PR" --json mergeCommit -q .mergeCommit.oid)
          if [ -z "$SHA" ]; then gh issue comment "$N" --body "⚠️ Откат: не нашёл слитый PR этой задачи."; gh issue edit "$N" --remove-label "откат"; exit 1; fi
          { [ -d node_modules/playwright ] || npm install --no-save --no-package-lock playwright@1.47.2 acorn@8; npx playwright install --with-deps chromium; } >/dev/null 2>&1
          if git revert --no-edit "$SHA" && node tests/run.js --quick $(o=$(node tests/impact.js HEAD~1 --only); [ "$o" != "all" ] && [ "$o" != "none" ] && echo "--only=$o") > /tmp/test.log 2>&1 && git push origin HEAD:main; then
            gh workflow run check.yml --ref main || true
            gh issue comment "$N" --body "↩️ **Откачено**${WHY:+ автоматически ($WHY)}: $PR отменён, тесты зелёные, сайт как до выкатки. <!-- hq:{\"rub\":0} -->"
            gh label create "откачено" >/dev/null 2>&1; gh issue edit "$N" --add-label "откачено" --remove-label "откат" --remove-label "готово"
          else
            { echo "⚠️ Откат не удался — сайт не трогал. Конец лога:"; echo '```'; tail -25 /tmp/test.log; echo '```'; } > /tmp/c.md
            gh issue comment "$N" --body-file /tmp/c.md; gh issue edit "$N" --remove-label "откат"; exit 1
          fi

  work:
    if: github.event.label.name == 'цех' || github.event.label.name == 'в работу' || github.event.label.name == 'ai-task'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # встроенный токен — только Issue и чтение: PR, пуш и слияние — токеном владельца в шаге, который не даёт ключей коду исполнителя
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    env:
      HQ_SANDBOX: '1'   # RUN и проверки исполнителя — в песочнице (tools/hq-run.js)
      N: ${{ github.event.issue.number }}
      HQ_ISSUE: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
      PROXYAPI_KEY: ${{ secrets.PROXYAPI_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false   # токен не лежит в .git/config: исполнитель (READ, RUN) его не увидит
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Задача и исполнитель
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          test -n "$PROXYAPI_KEY" || { echo "::error::Нет секрета PROXYAPI_KEY"; exit 1; }
          printf '# %s\n\n%s\n' "$TITLE" "$BODY" > /tmp/hq-task.md
          M=$(echo "$LABELS" | tr ',' '\n' | sed -n 's/^исп://p' | head -1)
          echo "MODEL=${M:-deepseek}" >> "$GITHUB_ENV"
          case ",$LABELS," in *,автовыкатка,*) echo "AUTO=1" >> "$GITHUB_ENV";; *) echo "AUTO=0" >> "$GITHUB_ENV";; esac
          gh issue edit "$N" --remove-label "готово" --remove-label "провал" --remove-label "на-проверку" >/dev/null 2>&1 || true
          echo '{"rub":0,"calls":0,"models":{}}' > /tmp/hq-cost.json
      - name: Кэш браузера
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            node_modules
          key: pw-1.47.2-acorn8-${{ runner.os }}
      - name: Браузер для тестов
        run: |
          [ -d node_modules/playwright ] || npm install --no-save --no-package-lock playwright@1.47.2 acorn@8
          npx playwright install --with-deps chromium
      - name: Исполнители (с эскалацией)
        id: work
        run: |
          set +e
          # код из ветки исполнителя (его правила модель) — только в песочнице: без ключей, без сети, со своим /proc.
          # sudo на раннере не пропускает окружение (-E игнорируется): окружение без секретов — файлом, запускатель читает его внутри
          cat > /tmp/hq-box.js <<'JS'
          const fs=require('fs'),{spawnSync}=require('child_process');const f=process.argv[2];const env=JSON.parse(fs.readFileSync(f,'utf8'));try{fs.unlinkSync(f)}catch(e){}const r=spawnSync(process.argv[3],process.argv.slice(4),{stdio:'inherit',env});process.exit(r.status==null?1:r.status);
          JS
          box(){ local f; f=$(mktemp); node -e "const e={...process.env};for(const k of Object.keys(e))if(/KEY|TOKEN|SECRET|PASSWORD|GH_|^GIT_CONFIG_/i.test(k))delete e[k];require('fs').writeFileSync(process.argv[1],JSON.stringify(e))" "$f"
            if sudo -n true 2>/dev/null; then sudo -n unshare --net --pid --fork --mount-proc -- sh -c 'ip link set lo up 2>/dev/null; exec setpriv --reuid='"$(id -u)"' --regid='"$(id -g)"' --init-groups -- "$@"' box "$(command -v node)" /tmp/hq-box.js "$f" "$@"
            else node /tmp/hq-box.js "$f" "$@"; fi; }
          git config user.name "hq-bot"; git config user.email "hq-bot@users.noreply.github.com"
          m="$MODEL"; tries=0; ok=0; : > /tmp/hq-log.md
          while [ -n "$m" ] && [ $tries -lt 3 ]; do
            tries=$((tries+1)); echo "::group::Попытка $tries — $m"
            git checkout -q -B "hq/issue-$N" origin/main && git reset -q --hard origin/main && git clean -fdq -e node_modules   # с чистого листа: правки прошлой попытки не переходят
            # дешёвая модель на первой попытке — две попытки параллельно в отдельных копиях, берётся первая зелёная
            # (две попытки DeepSeek стоят копейки, а шанс сделать с первого раза выше; Opus подключается реже)
            if [ $tries -eq 1 ] && echo "$m" | grep -qE '^(deepseek|dsv4|haiku|flash)$'; then
              for a in 1 2; do rm -rf /tmp/a$a; git worktree add -q -f /tmp/a$a HEAD; ln -s "$PWD/node_modules" /tmp/a$a/node_modules; echo '{"rub":0,"calls":0,"models":{}}' > /tmp/c$a.json; done
              (cd /tmp/a1 && HQ_CHECK_LOCK=/tmp/hq-check.lock HQ_COST_FILE=/tmp/c1.json HQ_DONE_FILE=/tmp/d1.txt node tools/hq-agent.js --model "$m" --task /tmp/hq-task.md > /tmp/a1.log 2>&1; echo $? > /tmp/a1.rc) &
              (cd /tmp/a2 && HQ_CHECK_LOCK=/tmp/hq-check.lock HQ_COST_FILE=/tmp/c2.json HQ_DONE_FILE=/tmp/d2.txt node tools/hq-agent.js --model "$m" --task /tmp/hq-task.md > /tmp/a2.log 2>&1; echo $? > /tmp/a2.rc) &
              wait
              node -e "const f=require('fs'),r=p=>{try{return JSON.parse(f.readFileSync(p))}catch(e){return {rub:0,calls:0,models:{}}}},t=r('/tmp/hq-cost.json');for(const p of ['/tmp/c1.json','/tmp/c2.json']){const c=r(p);t.rub=Math.round((t.rub+c.rub)*100)/100;t.calls+=c.calls;for(const k in c.models)t.models[k]=Math.round(((t.models[k]||0)+c.models[k])*100)/100}f.writeFileSync('/tmp/hq-cost.json',JSON.stringify(t))"
              PICK=""; for a in 1 2; do if [ "$(cat /tmp/a$a.rc)" = 0 ] && [ -z "$PICK" ]; then PICK=$a; fi; done
              if [ -n "$PICK" ]; then (cd /tmp/a$PICK && git add -A && git diff --cached --binary HEAD) > /tmp/pick.patch; git apply --index /tmp/pick.patch && git reset -q; cp /tmp/a$PICK.log /tmp/agent.log; cp /tmp/d$PICK.txt /tmp/hq-done.txt 2>/dev/null; echo "Взята попытка $PICK из двух"; AGENT_OK=1
              else cat /tmp/a1.log > /tmp/agent.log; AGENT_OK=0; fi
              for a in 1 2; do git worktree remove --force /tmp/a$a; done
            else
              node tools/hq-agent.js --model "$m" --task /tmp/hq-task.md > /tmp/agent.log 2>&1 && AGENT_OK=1 || AGENT_OK=0
            fi
            if [ "$AGENT_OK" = 1 ]; then
              cat /tmp/agent.log
              ONLY=$(box node tests/impact.js origin/main --only); echo "Задето: $ONLY"
              if [ "$ONLY" = "none" ] || box node tests/run.js --quick $([ "$ONLY" != "all" ] && echo "--only=$ONLY") > /tmp/test.log 2>&1; then ok=1; echo "::endgroup::"; break; fi
              echo "- **$m**: правка есть, быстрые тесты красные" >> /tmp/hq-log.md
              tail -40 /tmp/test.log
            else
              cat /tmp/agent.log; echo "- **$m**: $(tail -1 /tmp/agent.log | cut -c1-200)" >> /tmp/hq-log.md
            fi
            echo "::endgroup::"
            m=$(git show origin/main:server/lib/hq/roster.js > /tmp/roster.js && node -e "console.log(require('/tmp/roster.js').ESCALATE[process.argv[1]]||'')" "$m")
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"; echo "model=$m" >> "$GITHUB_OUTPUT"
      - name: PR, ревизор, выкатка
        if: steps.work.outputs.ok == '1'
        env:
          # PR создаёт и вливает токен владельца: встроенному токену Actions запрещено создавать PR (настройки репозитория);
          # PR от него запускает и проверку сайта на PR
          GH_TOKEN: ${{ secrets.GH_HQ_TOKEN || secrets.GH_CEO_TOKEN || github.token }}
          TITLE: ${{ github.event.issue.title }}
          M: ${{ steps.work.outputs.model }}
          # адрес живого предпросмотра (переменная репозитория HQ_PREVIEW_URL, например https://preview.nachert1830.ru); без неё — ветка preview через raw.githack.com
          PREVIEW_URL: ${{ vars.HQ_PREVIEW_URL }}
        run: |
          set +e
          # код из ветки исполнителя (его правила модель) — только в песочнице: без ключей, без сети, со своим /proc.
          # sudo на раннере не пропускает окружение (-E игнорируется): окружение без секретов — файлом, запускатель читает его внутри
          cat > /tmp/hq-box.js <<'JS'
          const fs=require('fs'),{spawnSync}=require('child_process');const f=process.argv[2];const env=JSON.parse(fs.readFileSync(f,'utf8'));try{fs.unlinkSync(f)}catch(e){}const r=spawnSync(process.argv[3],process.argv.slice(4),{stdio:'inherit',env});process.exit(r.status==null?1:r.status);
          JS
          box(){ local f; f=$(mktemp); node -e "const e={...process.env};for(const k of Object.keys(e))if(/KEY|TOKEN|SECRET|PASSWORD|GH_|^GIT_CONFIG_/i.test(k))delete e[k];require('fs').writeFileSync(process.argv[1],JSON.stringify(e))" "$f"
            if sudo -n true 2>/dev/null; then sudo -n unshare --net --pid --fork --mount-proc -- sh -c 'ip link set lo up 2>/dev/null; exec setpriv --reuid='"$(id -u)"' --regid='"$(id -g)"' --init-groups -- "$@"' box "$(command -v node)" /tmp/hq-box.js "$f" "$@"
            else node /tmp/hq-box.js "$f" "$@"; fi; }
          # ревизор — из main: правка исполнителя не может переписать своего судью
          rm -rf /tmp/trusted; git worktree add -q -f /tmp/trusted origin/main
          git add -A
          # правки самого Цеха, тестов и CI — только по «влить» владельца, без автовыкатки
          PROT=$(git diff --cached --name-only origin/main | grep -E '^(\.github/|tools/|tests/|server/lib/hq/|node_modules/)' | head -5 | tr '\n' ' ')
          if [ -n "$PROT" ]; then AUTO=0; echo "- правка задевает Цех, тесты или CI ($PROT) — автовыкатки нет, ждёт твоего «влить»" >> /tmp/hq-log.md; fi
          git -c core.hooksPath=/dev/null commit -q -m "Цех: $TITLE" -m "Исполнитель: $M. Задача #$N."
          # checkout без сохранённого токена — пуш с токеном в заголовке (в .git/config его нет, исполнитель не видит)
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push -q -f origin "hq/issue-$N"
          git diff origin/main...HEAD > /tmp/hq.diff
          PR=$(gh pr list --head "hq/issue-$N" --json url -q '.[0].url')
          [ -n "$PR" ] || PR=$(gh pr create --head "hq/issue-$N" --base main --title "Цех: $TITLE" --body "Задача #$N. Исполнитель: **$M**. $(cat /tmp/hq-done.txt 2>/dev/null)" 2>/tmp/pr.err)
          [ -n "$PR" ] || echo "- PR не создан: $(head -c 300 /tmp/pr.err)" >> /tmp/hq-log.md
          echo "PR=$PR" >> "$GITHUB_ENV"
          REV=$(env -u GH_TOKEN node /tmp/trusted/tools/hq-review.js --model sonnet --task /tmp/hq-task.md --diff /tmp/hq.diff); RC=$?
          NOTES=$(echo "$REV" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const v=JSON.parse(s);console.log((v.notes||[]).map(x=>'- '+x).join('\n'))}catch(e){console.log('- ревизор не ответил')}})")
          STATUS="на-проверку"; MSG="🔍 **Готово, ждёт твоего решения.** PR: $PR"
          if [ "$RC" = 0 ] && [ "$AUTO" = 1 ]; then
            ONLY=$(box node tests/impact.js origin/main --only)
            if [ "$ONLY" = "none" ] || box node tests/run.js $([ "$ONLY" != "all" ] && echo "--only=$ONLY") > /tmp/full.log 2>&1; then
              if gh pr merge "$PR" --squash --delete-branch; then STATUS="готово"; MSG="✅ **Выкачено на сайт.** PR: $PR"
              else MSG="⚠️ Тесты и ревизор — зелёные, но влить не вышло (конфликт с main — другая задача правила то же место, или защита ветки). PR: $PR. Перезапусти задачу — исполнитель начнёт со свежего main."; fi
              gh workflow run check.yml --ref main || true   # полная проверка main; красная → Issue «main красный»
            else MSG="⚠️ Быстрые тесты зелёные, проверка перед выкаткой — красная, в main не влито. PR: $PR"; tail -40 /tmp/full.log; fi
          fi
          # предпросмотр (ждёт твоего «влить»): правка — в ветку preview (живая ссылка), скриншоты «было / стало» на телефоне и компьютере
          PREVIEW=""; SHOTS=""
          if [ "$STATUS" = "на-проверку" ] && [ -n "$PR" ]; then
            PAGE=$(box node -e "console.log(require('./tools/hq-preview.js').pageOf(require('fs').readFileSync('/tmp/hq-task.md','utf8')))")
            rm -rf /tmp/base; git worktree add -q -f /tmp/base origin/main && ln -s "$PWD/node_modules" /tmp/base/node_modules
            SHA0=$(git rev-parse HEAD); mkdir -p _preview
            box node tools/hq-preview.js --root /tmp/base --page "$PAGE" --out _preview/before || true
            box node tools/hq-preview.js --root . --page "$PAGE" --out _preview/after || true
            git worktree remove --force /tmp/base || true
            git add -f _preview && git -c core.hooksPath=/dev/null commit -q -m "Предпросмотр задачи #$N" -m "Страница: $PAGE" && \
              git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push -q -f origin HEAD:refs/heads/preview && {
                SHA=$(git rev-parse HEAD); BASE="${PREVIEW_URL:-https://raw.githack.com/$GITHUB_REPOSITORY/preview}"
                PREVIEW=$(box node -e "console.log(require('./tools/hq-preview.js').pageUrl(process.argv[1],process.argv[2]))" "$BASE" "$PAGE")
                RAW="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$SHA/_preview"
                SHOTS="$RAW/before-phone.png $RAW/after-phone.png $RAW/before-desktop.png $RAW/after-desktop.png"
                MSG="$MSG"$'\n\n'"👀 **Предпросмотр:** $PREVIEW"$'\n\n'"Было → стало (телефон): ![]($RAW/before-phone.png) ![]($RAW/after-phone.png)"; }
            git reset -q --hard "$SHA0"; rm -rf _preview
          fi
          RUB=$(node -e "console.log(require('/tmp/hq-cost.json').rub)")
          META=$(node -e "const [rub,model,pr,preview,shots]=process.argv.slice(1);console.log(JSON.stringify({rub:+rub,model,pr,preview:preview||undefined,shots:shots?shots.split(' '):undefined}))" "$RUB" "$M" "$PR" "$PREVIEW" "$SHOTS")
          printf '%s\n\nОтчёт: %s\n\nИсполнитель: **%s**. Стоимость: ~%s ₽.\n\nРевизор:\n%s\n\nПопытки:\n%s\n<!-- hq:%s -->\n' \
            "$MSG" "$(head -c 400 /tmp/hq-done.txt 2>/dev/null | tr '\n' ' ')" "$M" "$RUB" "$NOTES" "$(cat /tmp/hq-log.md)" "$META" > /tmp/c.md
          gh issue comment "$N" --body-file /tmp/c.md
          gh issue edit "$N" --add-label "$STATUS" >/dev/null 2>&1 || { gh label create "$STATUS" >/dev/null 2>&1; gh issue edit "$N" --add-label "$STATUS"; }
          [ "$STATUS" = "готово" ] && gh issue close "$N" || true
      - name: Не получилось
        if: steps.work.outputs.ok != '1'
        run: |
          RUB=$(node -e "console.log(require('/tmp/hq-cost.json').rub)" 2>/dev/null || echo 0)
          { echo "❌ **Не получилось** — ни один исполнитель не прошёл тесты. В main ничего не попало."; echo; echo "Попытки:"; cat /tmp/hq-log.md; echo;
            echo "Конец лога тестов:"; echo '```'; tail -25 /tmp/test.log 2>/dev/null; echo '```'; echo "Стоимость: ~$RUB ₽. Уточни ТЗ в Штабе или смени исполнителя и перезапусти.";
            echo "<!-- hq:{\"rub\":$RUB,\"model\":\"$MODEL\"} -->"; } > /tmp/c.md
          gh issue comment "$N" --body-file /tmp/c.md
          gh issue edit "$N" --add-label "провал" >/dev/null 2>&1 || { gh label create "провал" >/dev/null 2>&1; gh issue edit "$N" --add-label "провал"; }
