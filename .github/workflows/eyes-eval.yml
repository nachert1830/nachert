name: Глаза сканера — какая модель лучше
# Синтетические листы ДЗ №3 (quadsynth.js, правда известна; половина — с ошибкой в части 1 или 4) → модель зрения
# (рамка каждого чертежа и номер части) → свои глаза + мозг → таблица: часть опознана, «верно», ошибка найдена, ЛОЖНЫХ,
# время, цена за лист (lab/dz/eyes-eval.js). Ничего не развёртывает. В зарубежные модели (OpenRouter) уходят только
# синтетические листы — фото студентов здесь нет.
on:
  workflow_dispatch:
    inputs:
      sheets:
        description: 'листов ДЗ №3 (по 4 чертежа; каждый второй — с ошибкой)'
        required: false
        default: '2'
      strategy:
        description: 'стратегия для моделей: own+full (свои глаза + рамки и части модели, как в сканере), full, zoom'
        required: false
        default: 'own+full'
  push:
    branches: [claude/eyes-best-models]
    paths: ['lab/dz/eyes-eval.js', 'lab/dz/eyes.js', 'server/lib/eyes.js', '.github/workflows/eyes-eval.yml']
permissions:
  contents: read
concurrency:
  group: eyes-eval-${{ github.ref }}
  cancel-in-progress: true
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: own, provider: none, model: ''}
          - {id: yandex-qwen, provider: yandex, model: 'qwen3.6-35b-a3b/latest'}
          - {id: gemini-3-pro, provider: openrouter, model: 'google/gemini-3-pro'}
          - {id: gemini-3-flash, provider: openrouter, model: 'google/gemini-3-flash'}
          - {id: gpt-5, provider: openrouter, model: 'openai/gpt-5'}
          - {id: claude-sonnet-5.5, provider: openrouter, model: 'anthropic/claude-sonnet-5.5'}
          - {id: qwen3-vl, provider: openrouter, model: 'qwen/qwen3-vl'}
          - {id: molmo-2, provider: openrouter, model: 'allenai/molmo-2-8b'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: IAM-токен Yandex Cloud (ключ аккаунта развёртывания)
        if: matrix.provider == 'yandex'
        env:
          YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
          YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID || 'b1gm1vb5prlop8thuobf' }}
        run: |
          test -n "$YC_SA_KEY" || { echo "::error::нет секрета YC_SA_KEY"; exit 1; }
          for i in 1 2 3; do timeout 120 bash -c 'curl -sSL --max-time 100 https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yc" -n >/dev/null' && break; sleep 5; done
          printf '%s' "$YC_SA_KEY" > "$RUNNER_TEMP/yc-key.json"
          "$HOME/yc/bin/yc" config profile create ci >/dev/null
          "$HOME/yc/bin/yc" config set service-account-key "$RUNNER_TEMP/yc-key.json"
          "$HOME/yc/bin/yc" config set folder-id "$YC_FOLDER_ID"
          T=$("$HOME/yc/bin/yc" iam create-token); echo "::add-mask::$T"
          echo "EYES_TOKEN=$T" >> "$GITHUB_ENV"; echo "EYES_FOLDER=$YC_FOLDER_ID" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/yc-key.json"
      - name: Замер
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EYES_OPTS: ${{ matrix.provider == 'yandex' && '{"reasoning_effort":"none"}' || '' }}
        run: |
          S=${{ github.event.inputs.sheets || '2' }}; ST=${{ github.event.inputs.strategy || 'own+full' }}
          case "${{ matrix.provider }}" in
            none) node lab/dz/eyes-eval.js --sheets=$S --dz2=0 --strategy=own --out=eyes-${{ matrix.id }}.json | grep -E '^(ИТОГО|  ЛОЖНО|OpenRouter|  ДЗ3)' ;;
            yandex) node lab/dz/eyes-eval.js --sheets=$S --dz2=0 --strategy=$ST --models=${{ matrix.model }} --out=eyes-${{ matrix.id }}.json | grep -E '^(ИТОГО|  ЛОЖНО|  ДЗ3)' ;;
            openrouter)
              test -n "$OPENROUTER_API_KEY" || { echo "::error::нет секрета OPENROUTER_API_KEY"; echo '{"rows":[{"name":"${{ matrix.model }}: нет секрета OPENROUTER_API_KEY","miss":true}]}' > eyes-${{ matrix.id }}.json; exit 1; }
              node lab/dz/eyes-eval.js --provider=openrouter --sheets=$S --dz2=0 --strategy=$ST --models=${{ matrix.model }} --out=eyes-${{ matrix.id }}.json | grep -E '^(ИТОГО|  ЛОЖНО|OpenRouter|  ДЗ3)' ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eyes-${{ matrix.id }}
          path: eyes-${{ matrix.id }}.json
          if-no-files-found: ignore
  table:
    needs: eval
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: res
      - name: Таблица
        run: node lab/dz/eyes-eval.js --table=res
      - uses: actions/upload-artifact@v4
        with:
          name: eyes-all
          path: res
