name: Цех разработки
on:
  issues:
    types: [labeled]
permissions:
  contents: write
  issues: write
concurrency:
  group: company-work
  cancel-in-progress: false

jobs:
  work:
    if: contains(github.event.issue.labels.*.name, 'в работу')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установка Aider
        run: pip install aider-chat

      - name: ИИ-Разработчик пишет код
        env:
          TASK_TITLE: ${{ github.event.issue.title }}
          TASK_BODY: ${{ github.event.issue.body }}
          OPENAI_API_KEY: ${{ secrets.PROXYAPI_KEY }}
          OPENAI_API_BASE: https://api.proxyapi.ru/v1
          AIDER_MODEL: openai/deepseek-chat
        run: |
          git config user.name "company-bot"
          git config user.email "company-bot@users.noreply.github.com"
          
          printf 'Задача для сайта:\nЗаголовок: %s\nОписание: %s\n' "$TASK_TITLE" "$TASK_BODY" > /tmp/task.txt
          
          aider --model "$AIDER_MODEL" --yes-always --no-auto-commits --message-file /tmp/task.txt
          
          git add -A
          git diff-index --quiet HEAD || git commit -m "Цех: $TASK_TITLE"

      - name: Быстрый автотест ядра
        id: qa
        continue-on-error: true
        run: |
          if [ -f "tests/run.js" ]; then
            node tests/run.js --quick
          fi

      - name: Влить изменения в main
        run: git push origin HEAD:main

      - name: Отчёт и закрытие задачи в Issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QA_OUTCOME: ${{ steps.qa.outcome }}
        run: |
          if [ "$QA_OUTCOME" = "success" ]; then
            gh issue comment ${{ github.event.issue.number }} --body "✅ **Задача выполнена и проверена.** Код опубликован в main."
          else
            gh issue comment ${{ github.event.issue.number }} --body "⚠️ **Код опубликован в main**, но тесты ядра выявили замечания. Логи: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          gh issue close ${{ github.event.issue.number }}
