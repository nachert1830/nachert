name: Проверка сайта
# Как в больших компаниях:
# • PR — выборочная проверка: tests/impact.js выбирает блоки, задетые правкой. «Ничего» — только если изменены одни документы
#   (*.md, docs/**); файл не из карты влияния — полная проверка. Карта сама проверяется (tests/impact.test.js) в задании plan.
# • main (пуш, ручной запуск, Цех после слияния) — полная проверка, параллельные потоки.
#   Красная — Issue «main красный» с концом лога: Штаб покажет его владельцу.
# • «Итог проверки» (задание gate) — одна обязательная проверка перед слиянием (docs/REQUIRED-CHECK.md):
#   зелёная, только если все задания прошли или законно пропущены (одни документы); красная или отменённая — не вливать.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  actions: write
  contents: read
  issues: write
concurrency:
  # новый пуш в PR отменяет устаревшую проверку того же PR; проверки main не отменяются никогда:
  # каждый коммит main получает свою полную проверку (у каждого прогона main — своя группа)
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      only: ${{ steps.p.outputs.only }}
      server: ${{ steps.p.outputs.server }}
      matrix: ${{ steps.s.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Карта влияния сама проверена
        run: node tests/impact.test.js
      - id: p
        name: Что задето
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "only=all" >> "$GITHUB_OUTPUT"; echo "server=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch -q origin "${{ github.base_ref }}"
          node tests/impact.js "origin/${{ github.base_ref }}"
          echo "only=$(node tests/impact.js "origin/${{ github.base_ref }}" --only)" >> "$GITHUB_OUTPUT"
          echo "server=$(node tests/impact.js "origin/${{ github.base_ref }}" --server)" >> "$GITHUB_OUTPUT"
      # замеры времени: свежие — из кэша последней полной проверки main (обновляются после каждой), иначе — tests/timings.json
      - name: Замеры времени
        uses: actions/cache/restore@v4
        with:
          path: timings-latest.json
          key: timings-${{ github.run_id }}
          restore-keys: timings-
      - id: s
        name: Раскладка по потокам
        run: |
          T=tests/timings.json; [ -s timings-latest.json ] && T=timings-latest.json
          # PR — меньше потоков на задачу (цель 5 мин), main — цель 8 мин с запасом
          TARGET=200; [ "${{ github.event_name }}" = "pull_request" ] && TARGET=170
          node tests/shards.js --only="${{ steps.p.outputs.only }}" --shards=auto --jobs=3 --target=$TARGET --timings=$T --out=plan.json
          echo "matrix=$(node -e "process.stdout.write(JSON.stringify(require('./plan.json').matrix))")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: plan.json

  server:
    needs: plan
    if: needs.plan.outputs.server == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Тесты сервера и кабинета
        run: cd server && npm test
      - name: Тесты исполнителя Цеха (командная строка RUN/CI)
        run: node --test tests/hq-agent.test.js

  check:
    needs: plan
    if: needs.plan.outputs.only != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plan
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # браузер и пакеты — из кэша (скачиваются один раз на версию, а не в каждом потоке каждого запуска);
      # системные пакеты (apt, до 6 мин на медленном зеркале) — только если без них браузер не запускается
      - name: Кэш браузера
        id: pw
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            node_modules
          key: pw-1.47.2-acorn8-${{ runner.os }}
      - name: Браузер для проверки
        run: |
          if [ "${{ steps.pw.outputs.cache-hit }}" = "true" ]; then node -e "require('playwright').chromium.launch().then(b=>b.close())" 2>/dev/null && echo "браузер запускается — системные пакеты не нужны" || npx playwright install-deps chromium >/dev/null
          else npm install --no-save --no-package-lock playwright@1.47.2 acorn@8 && npx playwright install --with-deps chromium; fi
      - name: Проверка (поток ${{ matrix.shard }})
        run: |
          node -e "const p=require('./plan.json');console.log('Поток ${{ matrix.shard }}: '+p.shards[${{ matrix.shard }}].map(s=>s.join(', ')).join(' | ')+' — расчёт '+p.est[${{ matrix.shard }}]+' с')"
          node tests/run.js --plan=plan.json --shard=${{ matrix.shard }} --jobs=3 --out=part-${{ matrix.shard }}.json $([ "${{ matrix.shard }}" = 0 ] && [ "${{ needs.plan.outputs.only }}" = all ] && echo --site=1) 2>&1 | tee /tmp/check.log; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: part-${{ matrix.shard }}
          path: part-${{ matrix.shard }}.json

  merge:
    # итог: пороги, отчёт и код выхода — по всем элементам всех потоков (нет результата элемента — красная)
    name: Итог блоков
    needs: [plan, check]
    if: always() && needs.plan.outputs.only != 'none' && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Итог
        run: |
          mkdir -p parts; cp art/part-*/part-*.json parts/ 2>/dev/null || true
          node tests/run.js --merge=parts --plan=art/plan/plan.json --json=metrics.json --timings=timings-new.json 2>&1 | tee /tmp/check.log; exit ${PIPESTATUS[0]}
      # метрики на коммит (как docs/thesis.json): одна строка итога — в сводке запуска, JSON — артефакт metrics-<коммит>
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metrics-${{ github.sha }}
          retention-days: 90
          path: |
            metrics.json
            timings-new.json
      # замеры времени обновляются автоматически после каждой полной проверки main (кэш читает задание plan)
      - name: Свежие замеры времени
        if: always() && github.ref == 'refs/heads/main' && needs.plan.outputs.only == 'all'
        run: |
          [ -s timings-new.json ] && node -e "const f=require('fs'),n=JSON.parse(f.readFileSync('timings-new.json'));let o={};try{o=JSON.parse(f.readFileSync('tests/timings.json'))}catch(e){};for(const g in o.elements||{})for(const k in o.elements[g])if(!(n.elements[g]||{})[k])(n.elements[g]=n.elements[g]||{})[k]=o.elements[g][k];f.writeFileSync('timings-latest.json',JSON.stringify(n,null,1))"
      - uses: actions/cache/save@v4
        if: always() && github.ref == 'refs/heads/main' && needs.plan.outputs.only == 'all' && hashFiles('timings-latest.json') != ''
        with:
          path: timings-latest.json
          key: timings-${{ github.run_id }}
      # автооткат: красный коммит — выкатка Цеха («Цех: …», «Задача #N.») → откатить её сразу, не дожидаясь владельца
      - name: Автооткат выкатки Цеха
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MSG=$(git log -1 --format=%B)
          N=$(echo "$MSG" | grep -o 'Задача #[0-9]*' | head -1 | tr -dc 0-9)
          if echo "$MSG" | head -1 | grep -q '^Цех:' && [ -n "$N" ]; then
            gh workflow run hq-work.yml --ref main -f issue="$N" -f why="полная проверка main красная" && echo "Автооткат задачи #$N запущен"
          fi
      - name: main красный — Issue для Штаба
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Полная проверка на main красная (коммит ${GITHUB_SHA::7})."; echo; echo '```'; tail -40 /tmp/check.log; echo '```';
            echo "Лог: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; } > /tmp/b.md
          N=$(gh issue list --label "main-красный" --state open --json number -q '.[0].number')
          if [ -n "$N" ]; then gh issue comment "$N" --body-file /tmp/b.md; else gh label create "main-красный" >/dev/null 2>&1; gh issue create --title "main красный: проверка сайта" --label "main-красный" --body-file /tmp/b.md; fi

  gate:
    # одна обязательная проверка перед слиянием: красная, если хоть одно задание упало или отменено;
    # пропуск законен, только когда план так решил (одни документы — блоков нет; нет серверных правок — тестов сервера нет)
    name: Итог проверки
    needs: [plan, server, check, merge]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Все задания зелёные
        run: |
          echo "plan=${{ needs.plan.result }} server=${{ needs.server.result }} check=${{ needs.check.result }} (блоки: ${{ needs.plan.outputs.only }}, сервер: ${{ needs.plan.outputs.server }})"
          [ "${{ needs.plan.result }}" = success ] || { echo "План не выполнен"; exit 1; }
          for r in "${{ needs.server.result }}" "${{ needs.check.result }}" "${{ needs.merge.result }}"; do case "$r" in success|skipped) ;; *) echo "Задание: $r"; exit 1;; esac; done
          if [ "${{ needs.plan.outputs.only }}" != none ] && { [ "${{ needs.check.result }}" != success ] || [ "${{ needs.merge.result }}" != success ]; }; then echo "Блоки выбраны, а проверка не прошла"; exit 1; fi
          if [ "${{ needs.plan.outputs.server }}" = 1 ] && [ "${{ needs.server.result }}" != success ]; then echo "Тесты сервера выбраны, а не прошли"; exit 1; fi
          echo "Итог: зелёная"
