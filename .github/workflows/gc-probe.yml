name: Проверка GoatCounter (временная)
on:
  push:
    branches: [claude/gc-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: свободны ли коды
        run: |
          for c in jjjj jjjjok nachertok nachert1830ok; do printf '%-15s ' $c; curl -sS -o /tmp/b -w '%{http_code} ' "https://$c.goatcounter.com/counter/TOTAL.json?start=2026-01-01"; head -c 120 /tmp/b | tr -d '\n'; echo; done
