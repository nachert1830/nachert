name: Проверка GoatCounter (временная)
on:
  push:
    branches: [claude/gc-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: что отдаёт nachert.ru
        run: |
          curl -sS -D - -o /tmp/p.html https://nachert.ru/ | head -20
          wc -c /tmp/p.html; grep -o '<title>[^<]*' /tmp/p.html | head -2
          grep -oE "ym\([0-9]+|metrika/tag.js\?id=[0-9]+|watch\.js|Ya\.Metrika2?\(\{id:[0-9]+|counter[0-9]+|id:\s*[0-9]{6,}|goatcounter|GC_CODE[^;]*|views\.json|manifest[^\"']*|tilda|wix|generator\"[^>]*" /tmp/p.html | sort | uniq -c | head -30
          curl -sS https://nachert.ru/manifest.webmanifest | head -c 300; echo
          curl -sS -o /dev/null -w 'sw.js %{http_code}\n' https://nachert.ru/sw.js
          curl -sS -o /dev/null -w 'views.json %{http_code}\n' https://nachert.ru/views.json
          echo "=== nachert1830.ru по http"; curl -sS -o /dev/null -w '%{http_code} %{redirect_url}\n' http://nachert1830.ru/
