name: Проверка GoatCounter (временная)
on:
  push:
    branches: [claude/gc-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: параметры TOTAL.json
        run: |
          for q in "" "?start=2026-10-12" "?start=2026-10-12" "?start=2026-01-01" "?start=2026-10-12&end=2026-10-17" "?start=2026-10-15&end=2026-10-15" "?start=2026-10-15&end=2026-10-16" "?start=2026-10-16&end=2026-10-16" "?start=2026-10-16" "?start=2026-10-16&end=2026-10-16" "?start=2026-10-17&end=2026-10-17" "?start=2026-10-12T00:00:00Z" "?end=2026-10-16"; do
            printf '%-45s ' "$q"; curl -sS -D /tmp/h "https://jjjj.goatcounter.com/counter/TOTAL.json$q" | tr -d '\n'; printf '  %s\n' "$(grep -i '^age' /tmp/h | tr -d '\r')"; done
