<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#07112a">
<title>Начерт — пульт CEO</title>
<link rel="icon" href="../icon-192.png">
<style>
@font-face{font-family:'Geologica';font-weight:400 700;font-display:swap;src:url(../fonts/geologica-cyrillic.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Golos Text';font-weight:400 700;font-display:swap;src:url(../fonts/golos-text-cyrillic.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
:root{
  --paper:#07112a; --surf:#0e1c3a; --surf2:#14264a; --surf3:#1b3260;
  --ink:#e8eef8; --ink2:#bccbe0; --mut:#8aa0c0; --line:#22355a;
  --acc:#2563eb; --blue:#7fb0ff; --blue-s:#132a55; --red:#ff6b6b; --red-b:#e0252c; --green:#5fd191; --run:#f0b43c;
  --shadow:0 10px 30px -14px rgba(0,0,0,.7);
  --sans:'Golos Text',system-ui,-apple-system,sans-serif;
  --disp:'Geologica','Golos Text',system-ui,sans-serif;
  --barh:56px;
}
@media (prefers-color-scheme:light){
  :root{ --paper:#eef3fc; --surf:#fff; --surf2:#f1f5fd; --surf3:#e3ecfb; --ink:#0a1733; --ink2:#2c3f5f; --mut:#56688a; --line:#d5e0f2;
    --acc:#1a5ae0; --blue:#1a5ae0; --blue-s:#e9f0ff; --red:#d9222a; --green:#13804e; --shadow:0 10px 30px -16px rgba(10,23,51,.35); }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:15px/1.45 var(--sans);-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}

#lock{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.lockc{width:min(380px,100%);background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:28px 22px;box-shadow:var(--shadow)}
.lockc h1{font:700 22px/1.2 var(--disp);margin:0 0 6px}
.lockc p{margin:0 0 18px;color:var(--mut);font-size:14px}
.lockc input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surf2);padding:0 14px}
.lockc .row{display:flex;gap:8px;margin-top:12px}
.btn{height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surf2);font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;flex:1}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.alt{background:var(--surf3);border-color:var(--line)}
.err{color:var(--red);font-size:14px;margin-top:12px;min-height:1.4em}

#hub{height:100%;display:flex;flex-direction:column}
.bar{height:var(--barh);flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--surf)}
.brand{font:700 16px var(--disp);white-space:nowrap}
.brand i{font-style:normal;color:var(--red)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tab{height:38px;padding:0 14px;border-radius:10px;border:0;background:none;color:var(--ink2);font-weight:600;white-space:nowrap}
.tab.on{background:var(--blue-s);color:var(--blue)}
.tools{display:flex;gap:6px;flex:none}
.stage{flex:1;min-height:0;display:flex;position:relative}

/* Секция Штаба CEO */
.pane.ceo-pane{overflow:auto;padding:20px;display:none;width:100%;height:100%}
.pane.ceo-pane.on{display:block}
.ceo-container{max-width:800px;margin:0 auto;display:grid;gap:20px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.card h2{font:700 18px var(--disp);margin:0 0 12px;color:var(--ink)}
textarea.ceo-input{width:100%;min-height:100px;border-radius:12px;border:1px solid var(--line);background:var(--surf2);padding:12px;resize:vertical;color:var(--ink)}
.row{display:flex;gap:10px;margin-top:10px}
.msg{color:var(--mut);font-size:14px;margin-top:8px;min-height:20px}
.it{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it a{color:var(--ink);text-decoration:none;font-weight:500;word-break:break-word}
.it a:hover{color:var(--blue)}
.st{white-space:nowrap;font-size:13px;font-weight:700;padding:4px 8px;border-radius:6px;background:var(--surf2)}
.st.run{color:var(--run)}.st.ok{color:var(--green)}
</style>
</head>
<body>
<section id="lock">
  <form class="lockc" id="lockForm" autocomplete="off">
    <h1>Пульт Начерта</h1>
    <p>Личная страница владельца. Вход по коду OWNER_CODE.</p>
    <input id="code" type="password" autocomplete="current-password" placeholder="Код владельца" required>
    <div class="row"><button class="btn pri" id="enter" type="submit">Войти</button></div>
    <div class="err" id="lockErr" role="alert"></div>
  </form>
</section>

<div id="hub" hidden>
  <header class="bar">
    <div class="brand">Начерт<i>·</i><span>пульт</span></div>
    <nav class="tabs" role="tablist" aria-label="Разделы">
      <button class="tab on" data-go="ceo">Штаб CEO</button>
      <button class="tab" data-go="scan">Скан</button>
      <button class="tab" data-go="lk">Кабинет</button>
      <button class="tab" data-go="site">Сайт</button>
    </nav>
    <div class="tools">
      <button class="btn sm" id="lockBtn">Выйти</button>
    </div>
  </header>

  <main class="stage">
    <div class="panes" id="panes" style="width:100%">
      <!-- Вкладка Штаб CEO -->
      <section class="pane ceo-pane on" data-pane="ceo">
        <div class="ceo-container">
          <div class="card">
            <h2>🧠 Новая идея для компании</h2>
            <textarea id="ceoIdea" class="ceo-input" placeholder="Опишите задачу простыми словами..."></textarea>
            <div class="row">
              <button class="btn pri" id="ceoSend">Отправить в Цех</button>
              <button class="btn alt" id="ceoMic" title="Диктовка">🎤</button>
            </div>
            <div class="msg" id="ceoMsg"></div>
          </div>

          <div class="card">
            <h2>📋 Текущие задачи цеха</h2>
            <div id="ceoList"><div class="msg">Загрузка задач…</div></div>
          </div>
        </div>
      </section>

      <!-- Остальные фреймы -->
      <iframe class="pane" data-pane="lk" title="Кабинет" allow="camera; fullscreen"></iframe>
      <iframe class="pane" data-pane="site" title="Сайт" allow="fullscreen"></iframe>
    </div>
  </main>
</div>

<script src="config.js"></script>
<script>
(function(){
  var API = window.CEO_API || "", $ = function(i){ return document.getElementById(i); }, code = "", timer;
  try { code = sessionStorage.getItem("ceo") || ""; } catch(e) {}

      body: body ? JSON.stringify(body) : undefined
    }).then(function(r){ return r.json().then(function(j){ j.status = r.status; return j; }); });
  }

    if (!API) { $("ceoList").innerHTML = '<div class="msg">Не задан API эндпоинт (отсутствует config.js)</div>'; return Promise.resolve(); }
    return call("GET").then(function(j){
      if (!j || !j.ok) { return j; }
      var h = (j.items || []).map(function(i){
        return '<div class="it"><a href="' + esc(i.url) + '" target="_blank" rel="noopener">#' + i.n + ' ' + esc(i.t) + '</a>' +
          '<span class="st ' + (i.done ? "ok" : "run") + '">' + (i.done ? "✔ в проде" : "⏳ цех работает") + '</span></div>';
      }).join("");
      $("ceoList").innerHTML = h || '<div class="msg">Задач пока нет</div>';
      return j;
    });
  }
